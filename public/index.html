// ── REASSIGN DRIVER ──────────────────────────────────────────────────────────
let reassignPayload = null;  // { scope: 'single'|'all-driver', loadIds: [], fromTruckId? }
let reassignTarget = null;   // truckId of selected new driver

function openReassignModal(scope, refId) {
  reassignTarget = null;
  document.getElementById('reassign-confirm-btn').disabled = true;

  let loadIds = [];
  let fromTruckId = null;
  let context = '';

  if (scope === 'single') {
    const l = loads.find(x => x.id === refId);
    if (!l) return;
    if (l.locked) { toast('This load is locked', 'error'); return; }
    const po = pos.find(p => p.id === l.poId) || {};
    loadIds = [l.id];
    fromTruckId = l.truckId;
    const fromTruck = trucks.find(t => t.id === l.truckId);
    context = `<b>${po.poNumber}</b> — ${po.customer}<br>`
      + `<b>Material:</b> ${l.material}, ${l.loadsAssigned} load${l.loadsAssigned !== 1 ? 's' : ''}<br>`
      + `<b>Currently:</b> ${fromTruck ? fromTruck.label : 'Unassigned'} · ${fmtDate(l.deliveryDate)}`;
  } else if (scope === 'all-driver') {
    const fromTruck = trucks.find(t => t.id === refId);
    if (!fromTruck) return;
    fromTruckId = fromTruck.id;
    // All UNLOCKED loads currently assigned to this driver, regardless of date
    const myLoads = loads.filter(l => l.truckId === fromTruck.id && !l.locked && !l.voided);
    if (!myLoads.length) { toast('No reassignable loads for this driver', 'error'); return; }
    loadIds = myLoads.map(l => l.id);
    // Group by date for context summary
    const byDate = {};
    myLoads.forEach(l => { byDate[l.deliveryDate] = (byDate[l.deliveryDate] || 0) + 1; });
    const dateSummary = Object.entries(byDate)
      .sort((a,b) => a[0].localeCompare(b[0]))
      .map(([d, n]) => `${n} on ${fmtDate(d)}`)
      .join(', ');
    context = `<b>Reassign all of ${fromTruck.label}'s loads</b><br>`
      + `<b>${myLoads.length}</b> unlocked load${myLoads.length !== 1 ? 's' : ''}: ${dateSummary}<br>`
      + `<span style="color:var(--txt3);font-size:11px">Locked (approved/billed) loads stay where they are.</span>`;
  }

  reassignPayload = { scope, loadIds, fromTruckId };
  document.getElementById('reassign-context').innerHTML = context;
  document.getElementById('reassign-reason').value = '';
  document.getElementById('reassign-reason-wrap').style.display = scope === 'all-driver' ? 'flex' : 'none';
  document.getElementById('reassign-warn').style.display = 'none';

  // Build driver list
  const driverHtml = trucks.map(t => {
    const isFrom = t.id === fromTruckId;
    const activeCount = loads.filter(l => l.truckId === t.id && l.status !== 'completed' && !l.voided).length;
    return `<div class="driver-pick ${isFrom ? 'disabled' : ''}" data-truckid="${t.id}"
      onclick="${isFrom ? '' : `selectReassignDriver('${t.id}', this)`}">
      <div class="driver-pick-avatar">${t.label.charAt(0)}</div>
      <div class="driver-pick-info">
        <div class="driver-pick-name">${t.label} ${isFrom ? '<span style="color:var(--txt3);font-size:11px;font-weight:400">(current)</span>' : ''}</div>
        <div class="driver-pick-detail">${t.truckNum} · ${activeCount} active load${activeCount !== 1 ? 's' : ''}</div>
      </div>
    </div>`;
  }).join('') + `<div class="driver-pick" data-truckid=""
      onclick="selectReassignDriver('', this)">
      <div class="driver-pick-avatar" style="background:var(--A)">⚠</div>
      <div class="driver-pick-info">
        <div class="driver-pick-name">Unassigned</div>
        <div class="driver-pick-detail">Move to the unassigned column</div>
      </div>
    </div>`;
  document.getElementById('reassign-driver-list').innerHTML = driverHtml;

  document.getElementById('reassign-modal').style.display = 'flex';
}

function selectReassignDriver(truckId, el) {
  reassignTarget = truckId;
  document.querySelectorAll('.driver-pick').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('reassign-confirm-btn').disabled = false;
}

function closeReassign() {
  document.getElementById('reassign-modal').style.display = 'none';
  reassignPayload = null;
  reassignTarget = null;
}

async function confirmReassign() {
  if (!reassignPayload || reassignTarget === null) return;
  const { loadIds } = reassignPayload;
  const newTruck = trucks.find(t => t.id === reassignTarget);
  const driverName = newTruck ? newTruck.label : '';

  // Update loads in parallel
  document.getElementById('reassign-confirm-btn').disabled = true;
  let success = 0, failed = 0;
  for (const id of loadIds) {
    const d = await api('PUT', '/api/loads/' + id, {
      truckId: reassignTarget || null,
      driverName,
    });
    if (d.ok) success++; else failed++;
  }

  if (failed === 0) {
    const target = newTruck ? newTruck.label : 'Unassigned';
    toast(`Reassigned ${success} load${success !== 1 ? 's' : ''} to ${target}`, 'success');
  } else {
    toast(`Reassigned ${success}, ${failed} failed`, failed > 0 ? 'error' : 'success');
  }

  closeReassign();
  await loadAll();
  if (currentTab === 'board') renderBoard();
}

// ── MOVE DATE ────────────────────────────────────────────────────────────────
let movePayload = null;  // { scope, poId, loadId, ... }

function openMoveModal(scope, refId) {
  // refId = loadId for 'single', poId for 'po' or 'remaining'
  movePayload = { scope, refId };

  let context = '', scopeOptions = '';
  let l = null, po = null;

  if (scope === 'single') {
    l = loads.find(x => x.id === refId);
    if (!l) return;
    po = pos.find(p => p.id === l.poId) || {};
    movePayload.loadId = l.id;
    movePayload.poId = po.id;
  } else {
    po = pos.find(p => p.id === refId);
    if (!po) return;
    movePayload.poId = po.id;
  }

  // Calculate totals for context
  const allPoLoads = loads.filter(x => x.poId === po.id && !x.voided);
  const remaining = allPoLoads.filter(x =>
    x.approvalStatus !== 'approved' &&
    x.approvalStatus !== 'submitted' &&
    x.billStatus !== 'billed' &&
    x.status !== 'completed' &&
    !x.locked
  );
  const completed = allPoLoads.length - remaining.length;

  // Build context box
  context = `<b>${po.poNumber}</b> — ${po.customer}<br>`;
  if (l) {
    context += `<b>This load:</b> ${l.material}, ${l.loadsAssigned} load${l.loadsAssigned !== 1 ? 's' : ''}, currently ${fmtDate(l.deliveryDate)}<br>`;
  }
  context += `<b>PO has:</b> ${allPoLoads.length} total loads — ${completed} done/locked, ${remaining.length} undelivered`;
  document.getElementById('move-context').innerHTML = context;

  // Build scope radio options based on what makes sense
  const opts = [];
  if (l) {
    opts.push({
      value: 'single',
      title: 'Move just this load',
      desc: `${l.material}, ${l.loadsAssigned} load${l.loadsAssigned !== 1 ? 's' : ''} only`,
      disabled: false
    });
  }
  opts.push({
    value: 'remaining',
    title: 'Move remaining undelivered loads',
    desc: `${remaining.length} unfinished load${remaining.length !== 1 ? 's' : ''} on this PO`,
    disabled: remaining.length === 0
  });
  opts.push({
    value: 'po',
    title: 'Move the entire PO',
    desc: `All ${allPoLoads.length} load${allPoLoads.length !== 1 ? 's' : ''} (locked ones will be skipped)`,
    disabled: false
  });

  scopeOptions = opts.map((o, i) => `
    <label class="move-scope-opt ${o.disabled ? 'disabled' : ''} ${i === 0 && !o.disabled ? 'selected' : ''}">
      <input type="radio" name="move-scope" value="${o.value}" ${o.disabled ? 'disabled' : ''} ${i === 0 && !o.disabled ? 'checked' : ''}
        onchange="document.querySelectorAll('.move-scope-opt').forEach(e=>e.classList.remove('selected'));this.closest('.move-scope-opt').classList.add('selected')">
      <div>
        <div class="opt-title">${o.title}</div>
        <div class="opt-desc">${o.desc}</div>
      </div>
    </label>
  `).join('');
  document.getElementById('move-scope-options').innerHTML = scopeOptions;

  // Default the date to tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('move-new-date').value = tomorrow.getFullYear() + '-' +
    String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' +
    String(tomorrow.getDate()).padStart(2, '0');
  document.getElementById('move-new-date').min = todayStr();

  document.getElementById('move-reason').value = '';
  document.getElementById('move-warn').style.display = 'none';
  document.getElementById('move-modal').style.display = 'flex';
}

function closeMove() {
  document.getElementById('move-modal').style.display = 'none';
  movePayload = null;
}

async function confirmMove() {
  if (!movePayload) return;
  const newDate = document.getElementById('move-new-date').value;
  const reason  = document.getElementById('move-reason').value.trim();
  const scope   = document.querySelector('input[name="move-scope"]:checked')?.value;

  const warn = document.getElementById('move-warn');
  warn.style.display = 'none';

  if (!scope)   { warn.textContent = 'Pick what to move'; warn.style.display = 'block'; return; }
  if (!newDate) { warn.textContent = 'Pick a new date'; warn.style.display = 'block'; return; }
  if (!reason)  { warn.textContent = 'Reason is required'; warn.style.display = 'block'; return; }

  const payload = {
    scope,
    newDate,
    reason,
    poId:   movePayload.poId,
    loadId: scope === 'single' ? movePayload.loadId : null,
  };

  const d = await api('POST', '/api/loads/move', payload);
  if (d.ok) {
    let msg = `Moved ${d.moved} load${d.moved !== 1 ? 's' : ''} to ${fmtDate(newDate)}`;
    if (d.skipped > 0) msg += ` (${d.skipped} locked, skipped)`;
    toast(msg, 'success');
    closeMove();
    await loadAll();
    if (currentTab === 'board') renderBoard();
  } else {
    toast(d.error || 'Move failed', 'error');
  }
}

// ── DRIVER VIEW ──────────────────────────────────────────────────────────────
async function renderDriver() {
  const wrap = document.getElementById('drv-trips');
  const welcome = document.getElementById('driver-welcome');

  if (!wrap) { console.error('drv-trips element missing'); return; }

  // Visible loading state immediately so we never have a blank page
  wrap.innerHTML = '<div class="empty-state"><p>Loading your trips...</p></div>';

  console.log('[DRIVER VIEW] Rendering driver view');
  console.log('[DRIVER VIEW] Logged-in driver name:', myUsername);
  console.log('[DRIVER VIEW] Logged-in driver truckId:', myTruckId);

  let dispatch = [];
  try {
    const r = await fetch('/api/my-dispatch');
    console.log('[DRIVER VIEW] /api/my-dispatch response status:', r.status);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || ('HTTP ' + r.status));
    }
    const d = await r.json();
    dispatch = d.loads || [];
    window._currentDispatch = dispatch;
    console.log('[DRIVER VIEW] Loads received from server:', dispatch.length);
    dispatch.forEach(l => console.log('  -', l.loadId, l.poNumber, l.material, '(' + l.loadsAssigned + ' loads)'));
  } catch (e) {
    console.error('[DRIVER VIEW] Failed to load:', e);
    wrap.innerHTML = `<div class="empty-state"><h3>Could not load trips</h3><p style="color:var(--R)">${e.message}</p><button class="btn primary" onclick="renderDriver()" style="margin-top:12px">Retry</button></div>`;
    return;
  }

  // Wrap render in try/catch so any rendering bug shows up instead of a blank page
  try {
    await renderDriverContent(dispatch, welcome, wrap);
  } catch (e) {
    console.error('[DRIVER VIEW] Render error:', e);
    wrap.innerHTML = `<div class="empty-state"><h3>Display error</h3><p style="color:var(--R);font-family:monospace;font-size:11px;text-align:left;background:var(--Rb);padding:12px;border-radius:8px;border:1px solid var(--Rd);overflow:auto;max-width:600px;margin:0 auto">${e.message}<br><br>${(e.stack||'').replace(/</g,'&lt;')}</p><button class="btn primary" onclick="renderDriver()" style="margin-top:12px">Retry</button></div>`;
  }
}

async function renderDriverContent(dispatch, welcome, wrap) {

  const todayCount = dispatch.filter(l => l.deliveryDate === todayStr()).length;
  const submittedCount = dispatch.filter(l => l.approvalStatus === 'submitted').length;
  const firstName = myUsername.charAt(0).toUpperCase() + myUsername.slice(1);

  welcome.innerHTML = `<div class="drv-welcome">
    <div class="drv-greeting">
      <div class="avatar">${firstName.charAt(0)}</div>
      <div>
        <div class="drv-hi">Hi, ${firstName}</div>
        <div class="drv-sub">${todayCount ? `<b>${todayCount}</b> trip${todayCount > 1 ? 's' : ''} today` : 'No trips today'}</div>
      </div>
    </div>
    <div class="drv-stats">
      <div><div class="drv-stat-num">${dispatch.length}</div><div class="drv-stat-lbl">Active</div></div>
      <div><div class="drv-stat-num">${submittedCount}</div><div class="drv-stat-lbl">Pending Review</div></div>
    </div>
  </div>`;

  if (!dispatch.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No trips assigned</h3><p>Your dispatcher will assign loads as they come in.</p></div>`;
    return;
  }

  wrap.innerHTML = dispatch.map(l => tripCard(l)).join('');
}

function tripCard(l) {
  const ts = l.timestamps || {};
  const pod = l.pod || {};
  const isToday = l.deliveryDate === todayStr();
  const started = !!ts.start;
  const atPickup = !!ts.arrivedPickup;
  const hasImage = !!l.ticketImage;
  const hasSig = !!(pod.signedBy && pod.signature);
  const delivered = !!ts.completed;
  const submitted = l.approvalStatus === 'submitted';
  const approved = l.approvalStatus === 'approved';
  const rejected = l.approvalStatus === 'rejected';

  let banner = '';
  if (rejected) banner = `<div class="banner rejected">⚠ Rejected by manager${l.rejectReason ? ': ' + l.rejectReason : ''} — re-do this trip</div>`;
  else if (approved) banner = `<div class="banner approved">✓ Approved — trip closed</div>`;
  else if (submitted) banner = `<div class="banner submitted">⏳ Submitted — waiting for manager approval</div>`;

  // If load was moved, show a notice with the most recent move reason
  if (l.moveHistory && l.moveHistory.length) {
    const latest = l.moveHistory[l.moveHistory.length - 1];
    banner += `<div class="banner" style="background:var(--Ab);color:var(--A);border:1px solid var(--Ad)">📅 Rescheduled from ${fmtDate(latest.from)} — ${latest.reason}</div>`;
  }

  const stepCls = (active, done) => done ? 'done' : active ? 'active' : '';

  let action = '';
  if (!started && !submitted) {
    action = `<button class="trip-action start" onclick="tripAction('${l.loadId}', 'start-trip')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Start Trip
    </button>
    <div class="action-hint">GPS and time captured automatically</div>`;
  } else if (started && !atPickup) {
    action = `<button class="trip-action pickup" onclick="openYardPicker('${l.loadId}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-7 9 7v12h-6v-7h-6v7H3z"/></svg>
      Arrived at Pickup
    </button>
    <div class="action-hint">Tap when you arrive — pick which yard</div>`;
  } else if (atPickup && !hasImage) {
    action = `<button class="trip-action ticket" onclick="openTicketUpload('${l.loadId}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Upload Ticket Photo
    </button>
    <div class="action-hint required">Required before delivery</div>`;
  } else if (hasImage && !hasSig) {
    action = `<button class="trip-action sign" onclick="openSig('${l.loadId}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"/></svg>
      Customer Signature
    </button>
    <div class="action-hint required">Required before delivery</div>`;
  } else if (hasSig && !submitted) {
    action = `<button class="trip-action complete" onclick="tripAction('${l.loadId}', 'delivered')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Complete Delivery
    </button>
    <div class="action-hint">Submits to manager for approval</div>`;
  }

  return `<div class="trip-card ${isToday ? 'is-today' : ''}">
    <div class="trip-head">
      <div class="trip-po">${l.poNumber}${isToday ? '<span class="today-badge">TODAY</span>' : ''}</div>
      <div class="trip-customer">${l.customer}</div>
    </div>
    <div class="trip-body">
      ${banner}
      <dl class="trip-info">
        <dt>Pickup</dt><dd>🏗️ ${l.pickupLocation}</dd>
        <dt>Deliver</dt><dd>📍 ${l.deliveryLocation || l.city}</dd>
        <dt>Material</dt><dd>${l.material}</dd>
        <dt>Loads</dt><dd><b>${l.loadsAssigned}</b> loads</dd>
        ${l.notes ? `<dt>Notes</dt><dd class="notes">${l.notes}</dd>` : ''}
      </dl>
      <div class="steps">
        <div class="step ${stepCls(!started && !submitted, started)}">Start${ts.start ? `<span class="step-time">${ts.start}</span>` : ''}</div>
        <div class="step ${stepCls(started && !atPickup, atPickup)}">Pickup${ts.arrivedPickup ? `<span class="step-time">${ts.arrivedPickup}</span>` : ''}</div>
        <div class="step ${stepCls(atPickup && !hasImage, hasImage)}">Ticket${hasImage ? '<span class="step-time">✓</span>' : ''}</div>
        <div class="step ${stepCls(hasImage && !hasSig, hasSig)}">Signed${hasSig ? '<span class="step-time">✓</span>' : ''}</div>
        <div class="step ${stepCls(hasSig && !submitted, submitted || delivered)}">Done${ts.completed ? `<span class="step-time">${ts.completed}</span>` : ''}</div>
      </div>
      ${action}
      ${started && !submitted ? `
        <div class="req-check ${hasImage ? 'done' : 'missing'}">
          <span>Ticket photo</span>
          <span>${hasImage ? '✓ Uploaded' : '— Missing'}</span>
        </div>
        ${hasImage ? `<img src="${l.ticketImage}" class="ticket-preview">` : ''}
        <div class="req-check ${hasSig ? 'done' : 'missing'}">
          <span>Customer signature</span>
          <span>${hasSig ? '✓ Signed by ' + pod.signedBy : '— Missing'}</span>
        </div>
      ` : ''}
    </div>
  </div>`;
}

// ── YARD PICKER ──
let yardLoadId = null;

function openYardPicker(loadId) {
  const dispatch = window._currentDispatch || [];
  const trip = dispatch.find(l => l.loadId === loadId);
  if (!trip) return;
  yardLoadId = loadId;

  document.getElementById('yard-info').innerHTML =
    `<b>${trip.poNumber}</b> — ${trip.customer}<br>`
    + `<b>Material:</b> ${trip.material}<br>`
    + (trip.pickupLocation ? `<b>Suggested:</b> ${trip.pickupLocation}` : '');

  // Find which yard matches the suggested pickup
  const suggestion = trip.pickupLocation || '';
  const suggestedYard = yards.find(y =>
    suggestion.toLowerCase().includes(y.name.toLowerCase()) ||
    y.name.toLowerCase().includes(suggestion.toLowerCase())
  );
  const ordered = suggestedYard
    ? [suggestedYard, ...yards.filter(y => y.id !== suggestedYard.id)]
    : yards;

  document.getElementById('yard-list').innerHTML = ordered.map(y => {
    const isSuggestion = suggestedYard && y.id === suggestedYard.id;
    return `<div class="yard-card ${isSuggestion ? 'preset' : ''}" onclick="confirmYard('${y.id}')">
      <div class="yard-icon">🏗️</div>
      <div style="flex:1">
        <div class="yard-name">${y.name}</div>
        ${y.location ? `<div class="yard-loc">📍 ${y.location}</div>` : ''}
        ${isSuggestion ? '<span class="yard-tag">✓ Assigned pickup</span>' : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('yard-modal').style.display = 'flex';
}

function closeYard() {
  document.getElementById('yard-modal').style.display = 'none';
  yardLoadId = null;
}

async function confirmYard(yardId) {
  if (!yardLoadId) return;
  let gps = null;
  try {
    gps = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  } catch (e) {}

  const d = await api('POST', `/api/loads/${yardLoadId}/trip-action`, { action: 'arrived-pickup', gps, yardId });
  if (d.ok) {
    toast('Arrived at yard', 'success');
    closeYard();
    await loadAll();
    renderDriver();
  } else toast(d.error || 'Failed', 'error');
}

async function tripAction(loadId, action) {
  let gps = null;
  try {
    gps = await new Promise(resolve => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  } catch (e) {}

  const d = await api('POST', `/api/loads/${loadId}/trip-action`, { action, gps });
  if (d.ok) {
    toast(action === 'delivered' ? 'Submitted for approval!' : 'Updated', 'success');
    await loadAll();
    renderDriver();
  } else {
    toast(d.error || 'Failed', 'error');
  }
}

// ── TICKET UPLOAD ────────────────────────────────────────────────────────────
function openTicketUpload(loadId) {
  currentLoadId = loadId;
  document.getElementById('ticket-input').value = '';
  document.getElementById('ticket-preview').style.display = 'none';
  document.getElementById('ticket-save-btn').disabled = true;
  document.getElementById('ticket-modal').style.display = 'flex';

  document.getElementById('ticket-input').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    // Compress to ~1200px max
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; }
        else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const data = canvas.toDataURL('image/jpeg', 0.85);
        const preview = document.getElementById('ticket-preview');
        preview.src = data;
        preview.style.display = 'block';
        preview.dataset.image = data;
        document.getElementById('ticket-save-btn').disabled = false;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
}

function closeTicket() { document.getElementById('ticket-modal').style.display = 'none'; }

async function saveTicket() {
  const data = document.getElementById('ticket-preview').dataset.image;
  if (!data || !currentLoadId) return;
  const d = await api('PUT', '/api/loads/' + currentLoadId, { ticketImage: data });
  if (d.ok) { closeTicket(); await loadAll(); renderDriver(); toast('Ticket uploaded', 'success'); }
  else toast(d.error || 'Failed', 'error');
}

// ── SIGNATURE ────────────────────────────────────────────────────────────────
let sigCanvas, sigCtx, sigDrawing = false, sigHasInk = false;

function openSig(loadId) {
  currentLoadId = loadId;
  sigHasInk = false;
  document.getElementById('sig-name').value = '';
  document.getElementById('sig-modal').style.display = 'flex';

  // Set up canvas
  setTimeout(() => {
    sigCanvas = document.getElementById('sig-canvas');
    sigCanvas.width = sigCanvas.offsetWidth;
    sigCanvas.height = 200;
    sigCtx = sigCanvas.getContext('2d');
    sigCtx.fillStyle = '#fff';
    sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
    sigCtx.strokeStyle = '#000';
    sigCtx.lineWidth = 2.5;
    sigCtx.lineCap = 'round';

    const start = (e) => { sigDrawing = true; sigCtx.beginPath(); const p = getPos(e); sigCtx.moveTo(p.x, p.y); };
    const move = (e) => { if (!sigDrawing) return; e.preventDefault(); const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigHasInk = true; };
    const end = () => { sigDrawing = false; };
    const getPos = (e) => {
      const rect = sigCanvas.getBoundingClientRect();
      const t = e.touches?.[0] || e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    };
    sigCanvas.onmousedown = start; sigCanvas.onmousemove = move; sigCanvas.onmouseup = end; sigCanvas.onmouseleave = end;
    sigCanvas.ontouchstart = start; sigCanvas.ontouchmove = move; sigCanvas.ontouchend = end;
  }, 50);
}

function clearSig() {
  if (!sigCtx) return;
  sigCtx.fillStyle = '#fff';
  sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
  sigHasInk = false;
}

function closeSig() { document.getElementById('sig-modal').style.display = 'none'; }

async function saveSig() {
  const name = document.getElementById('sig-name').value.trim();
  if (!name) { toast('Customer name required', 'error'); return; }
  if (!sigHasInk) { toast('Please sign on the canvas', 'error'); return; }
  const sig = sigCanvas.toDataURL('image/png');
  const d = await api('PUT', '/api/loads/' + currentLoadId, {
    pod: { signedBy: name, signature: sig, signedAt: new Date().toISOString() }
  });
  if (d.ok) { closeSig(); await loadAll(); renderDriver(); toast('Signature saved', 'success'); }
  else toast(d.error || 'Failed', 'error');
}

// ── APPROVALS ────────────────────────────────────────────────────────────────
function renderApprovals() {
  const submitted = loads.filter(l => l.approvalStatus === 'submitted' && !l.voided);
  const wrap = document.getElementById('approve-list');
  if (!submitted.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No loads awaiting approval</h3><p>Approved loads automatically move to "Ready to Bill".</p></div>`;
    return;
  }
  wrap.innerHTML = submitted.map(l => {
    const po = pos.find(p => p.id === l.poId) || {};
    const ts = l.timestamps || {};
    const pod = l.pod || {};
    return `<div class="approve-mini">
      <div class="approve-mini-row">
        <div class="am-info">
          <div class="am-po">${po.poNumber}</div>
          <div class="am-customer">${po.customer}</div>
          <div class="am-detail">${l.material} · ${l.loadsDelivered}/${l.loadsAssigned} loads · ${l.driverName}${l.actualYardName ? ' · 🏗️ ' + l.actualYardName : ''}</div>
        </div>
        <div class="am-thumbs">
          ${l.ticketImage ? `<img src="${l.ticketImage}" class="am-thumb" onclick="event.stopPropagation();showImage('${l.ticketImage}')" title="Ticket photo">` : '<div class="am-thumb missing">No ticket</div>'}
          ${pod.signature ? `<img src="${pod.signature}" class="am-thumb" onclick="event.stopPropagation();showImage('${pod.signature}')" title="Signature: ${pod.signedBy}">` : '<div class="am-thumb missing">No sig</div>'}
        </div>
        <div class="am-actions">
          <button class="btn danger" onclick="rejectLoad('${l.id}')">Reject</button>
          <button class="btn success" onclick="approveLoad('${l.id}')">Approve</button>
        </div>
      </div>
      <div class="am-meta">
        <span>${fmtDate(l.deliveryDate)} · Start ${ts.start || '—'} · Pickup ${ts.arrivedPickup || '—'} · Done ${ts.completed || '—'}</span>
        <span>Signed: ${pod.signedBy || '—'}</span>
      </div>
    </div>`;
  }).join('');
}

// Click thumbnails to view full image
function showImage(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${src}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

function updateApproveBadge() {
  const count = loads.filter(l => l.approvalStatus === 'submitted' && !l.voided).length;
  const badge = document.getElementById('approve-badge');
  if (count > 0) { badge.textContent = count; badge.style.display = 'inline-block'; }
  else { badge.style.display = 'none'; }
}

async function approveLoad(id) {
  const d = await api('POST', '/api/loads/' + id + '/approve', {});
  if (d.ok) { toast('Approved & locked', 'success'); await loadAll(); renderApprovals(); updateApproveBadge(); }
  else toast(d.error || 'Failed', 'error');
}

async function rejectLoad(id) {
  const reason = prompt('Reason for rejection?');
  if (!reason) return;
  const d = await api('POST', '/api/loads/' + id + '/reject', { reason });
  if (d.ok) { toast('Rejected', 'success'); await loadAll(); renderApprovals(); updateApproveBadge(); }
  else toast(d.error || 'Failed', 'error');
}

// ── BILLING ──────────────────────────────────────────────────────────────────
let billFilters = { month: '', material: '', truckId: '' };
let billSelected = new Set();

function renderBilling() {
  // Build filter bar
  const months = [...new Set(loads.filter(l => l.approvalStatus === 'approved' && l.billStatus === 'ready').map(l => (l.deliveryDate || '').slice(0, 7)))].sort().reverse();
  document.getElementById('bill-filters').innerHTML = `
    <select class="bill-filter" onchange="billFilters.month=this.value;loadBilling()">
      <option value="">All months</option>
      ${months.map(m => `<option value="${m}" ${billFilters.month === m ? 'selected' : ''}>${m}</option>`).join('')}
    </select>
    <select class="bill-filter" onchange="billFilters.material=this.value;loadBilling()">
      <option value="">All materials</option>
      ${materials.map(m => `<option value="${m}" ${billFilters.material === m ? 'selected' : ''}>${m}</option>`).join('')}
    </select>
    <select class="bill-filter" onchange="billFilters.truckId=this.value;loadBilling()">
      <option value="">All drivers</option>
      ${trucks.map(t => `<option value="${t.id}" ${billFilters.truckId === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
    </select>
    <span style="flex:1"></span>
    <button class="btn primary" onclick="markBilled()" id="mark-billed-btn" disabled>Mark ${billSelected.size} as Billed</button>
  `;
  loadBilling();
}

async function loadBilling() {
  const params = new URLSearchParams();
  if (billFilters.month)    params.set('month', billFilters.month);
  if (billFilters.material) params.set('material', billFilters.material);
  if (billFilters.truckId)  params.set('truckId', billFilters.truckId);
  const r = await fetch('/api/ready-to-bill?' + params);
  const d = await r.json();
  const items = d.items || [];

  const wrap = document.getElementById('bill-list');
  if (!items.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No loads ready to bill</h3><p>Approve loads from the Approvals tab to add them here.</p></div>`;
    return;
  }
  wrap.innerHTML = `<table class="bill-table">
    <thead><tr>
      <th><input type="checkbox" id="bill-all" onchange="toggleAllBill(this.checked)"></th>
      <th>PO</th><th>Customer</th><th>City</th><th>Material</th><th>Loads</th><th>Driver</th><th>Date</th><th>Approved</th>
    </tr></thead>
    <tbody>
      ${items.map(l => `<tr>
        <td><input type="checkbox" data-id="${l.id}" onchange="toggleBillSelect('${l.id}', this.checked)" ${billSelected.has(l.id) ? 'checked' : ''}></td>
        <td style="font-weight:600;color:var(--B)">${l.poNumber}</td>
        <td>${l.customer}</td>
        <td>${l.city || '—'}</td>
        <td>${l.material}</td>
        <td>${l.loadsDelivered}</td>
        <td>${l.driverName}</td>
        <td>${fmtDate(l.deliveryDate)}</td>
        <td style="font-size:11px;color:var(--txt2)">${l.approvedAt ? new Date(l.approvedAt).toLocaleDateString() : ''}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

function toggleBillSelect(id, checked) {
  if (checked) billSelected.add(id); else billSelected.delete(id);
  document.getElementById('mark-billed-btn').disabled = billSelected.size === 0;
  document.getElementById('mark-billed-btn').textContent = `Mark ${billSelected.size} as Billed`;
}

function toggleAllBill(checked) {
  document.querySelectorAll('[data-id]').forEach(cb => {
    cb.checked = checked;
    if (checked) billSelected.add(cb.dataset.id); else billSelected.delete(cb.dataset.id);
  });
  document.getElementById('mark-billed-btn').disabled = billSelected.size === 0;
  document.getElementById('mark-billed-btn').textContent = `Mark ${billSelected.size} as Billed`;
}

async function markBilled() {
  if (!billSelected.size) return;
  if (!confirm(`Mark ${billSelected.size} load(s) as billed? This is permanent.`)) return;
  const d = await api('POST', '/api/loads/bill', { loadIds: [...billSelected] });
  if (d.ok) {
    toast(`Marked ${d.billed} as billed`, 'success');
    billSelected.clear();
    await loadAll();
    renderBilling();
  } else toast(d.error || 'Failed', 'error');
}

// ── REPORTS / FINANCE ────────────────────────────────────────────────────────
async function renderReports() {
  const wrap = document.getElementById('reports-content');
  wrap.innerHTML = '<div class="empty-state"><p>Loading reports...</p></div>';
  try {
    const r = await fetch('/api/reports');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    let h = '<div class="reports-wrap">';

    // Top stat cards
    h += `<div class="stat-grid">
      <div class="stat-card"><div class="stat-num blue">${data.totals.activePOs}</div><div class="stat-lbl">Active POs</div></div>
      <div class="stat-card"><div class="stat-num">${data.totals.scheduledPOs}</div><div class="stat-lbl">Scheduled</div></div>
      <div class="stat-card"><div class="stat-num">${data.totals.totalLoads}</div><div class="stat-lbl">Total loads</div></div>
      <div class="stat-card"><div class="stat-num amber">${data.totals.readyToBill}</div><div class="stat-lbl">Ready to bill</div></div>
      <div class="stat-card"><div class="stat-num green">${data.totals.billedThisMonth}</div><div class="stat-lbl">Billed this month</div></div>
    </div>`;

    // Weekly chart
    if (data.weeks?.length) {
      const maxVal = Math.max(1, ...data.weeks.map(w => w.ordered));
      h += `<h3>Weekly load volume — last 8 weeks</h3>
      <div class="weekly-chart">
        ${data.weeks.map(w => {
          const orderedPct = (w.ordered / maxVal) * 100;
          const deliveredPct = w.ordered > 0 ? (w.delivered / w.ordered) * 100 : 0;
          return `<div class="week-col" title="${w.label}: ${w.delivered}/${w.ordered}">
            <div class="week-num">${w.ordered || ''}</div>
            <div class="week-bar-wrap" style="height:${Math.max(orderedPct, 2)}%">
              <div class="week-bar-fill" style="height:${deliveredPct}%"></div>
            </div>
            <div class="week-lbl">${w.label}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--txt2)">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--G);border-radius:2px;margin-right:4px"></span>Delivered</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--Bd);border-radius:2px;margin-right:4px"></span>Ordered</span>
      </div>`;
    }

    // Driver performance
    const dStats = Object.values(data.driverStats || {}).sort((a,b) => b.delivered - a.delivered);
    if (dStats.length) {
      h += '<h3>Driver Performance</h3><table class="report-table"><thead><tr><th>Driver</th><th>Truck</th><th>Total Loads</th><th>Delivered</th><th>Completion</th><th>Active Now</th></tr></thead><tbody>';
      dStats.forEach(d => {
        const pct = d.totalLoads > 0 ? Math.round(d.delivered / d.totalLoads * 100) : 0;
        const color = pct >= 80 ? 'var(--G)' : pct >= 50 ? 'var(--A)' : 'var(--R)';
        h += `<tr>
          <td style="font-weight:600">${d.label}</td>
          <td style="font-size:11px;color:var(--txt2)">${d.truckNum}</td>
          <td>${d.totalLoads}</td>
          <td>${d.delivered}</td>
          <td><div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span style="font-size:11px;font-weight:600;min-width:34px">${pct}%</span></div></td>
          <td>${d.active}</td>
        </tr>`;
      });
      h += '</tbody></table>';
    }

    // Top customers
    const cStats = Object.entries(data.custStats || {}).sort((a,b) => b[1].loads - a[1].loads).slice(0, 10);
    if (cStats.length) {
      h += '<h3>Top Customers (by load volume)</h3><table class="report-table"><thead><tr><th>Customer</th><th>POs</th><th>Loads Ordered</th><th>Delivered</th><th>Rate</th></tr></thead><tbody>';
      cStats.forEach(([name, d]) => {
        const pct = d.loads > 0 ? Math.round(d.delivered / d.loads * 100) : 0;
        const color = pct >= 80 ? 'var(--G)' : pct >= 50 ? 'var(--A)' : 'var(--R)';
        h += `<tr><td style="font-weight:600">${name}</td><td>${d.pos}</td><td>${d.loads}</td><td>${d.delivered}</td><td style="color:${color};font-weight:600">${pct}%</td></tr>`;
      });
      h += '</tbody></table>';
    }

    // Material breakdown
    const mStats = Object.entries(data.matStats || {}).sort((a,b) => b[1].ordered - a[1].ordered);
    if (mStats.length) {
      h += '<h3>Material Volume</h3><table class="report-table"><thead><tr><th>Material</th><th>Ordered</th><th>Delivered</th><th>Rate</th></tr></thead><tbody>';
      mStats.forEach(([m, d]) => {
        const pct = d.ordered > 0 ? Math.round(d.delivered / d.ordered * 100) : 0;
        h += `<tr><td>${m}</td><td>${d.ordered}</td><td>${d.delivered}</td><td><div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--B)"></div></div><span style="font-size:11px;font-weight:600;min-width:34px">${pct}%</span></div></td></tr>`;
      });
      h += '</tbody></table>';
    }

    h += '</div>';
    wrap.innerHTML = h;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><h3>Could not load reports</h3><p style="color:var(--R)">${e.message}</p><button class="btn primary" onclick="renderReports()" style="margin-top:12px">Retry</button></div>`;
  }
}

// ── HISTORY ──────────────────────────────────────────────────────────────────
async function renderHistory() {
  const wrap = document.getElementById('history-content');
  wrap.innerHTML = '<div class="empty-state"><p>Loading history...</p></div>';
  try {
    const r = await fetch('/api/history');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const billed = data.billed || [];
    const archive = data.archive || [];

    let h = '<div class="history-wrap">';

    // Section 1: Billed loads ready to archive
    h += `<div class="history-section">
      <div class="history-head">
        <div>
          <h2>Billed Loads (${billed.length})</h2>
          <p>These loads have been billed. Send to Google Sheets to permanently archive them and clear from the app.</p>
        </div>
        ${billed.length ? `<button class="btn success" onclick="archiveToSheets()">↑ Send to Sheets & Archive</button>` : ''}
      </div>`;

    if (billed.length === 0) {
      h += '<div class="empty-state" style="padding:30px"><p>No billed loads waiting to archive.</p></div>';
    } else {
      h += `<table class="report-table" style="border-radius:0;box-shadow:none;margin:0">
        <thead><tr><th>PO</th><th>Customer</th><th>Material</th><th>Loads</th><th>Driver</th><th>Yard</th><th>Date</th><th>Billed</th></tr></thead>
        <tbody>
        ${billed.map(l => `<tr>
          <td style="font-weight:600;color:var(--B)">${l.poNumber}</td>
          <td>${l.customer}</td>
          <td>${l.material}</td>
          <td>${l.loadsDelivered}</td>
          <td>${l.driverName}</td>
          <td>${l.actualYardName || l.pickup || '—'}</td>
          <td>${fmtDate(l.deliveryDate)}</td>
          <td style="font-size:11px;color:var(--txt2)">${l.billedAt ? new Date(l.billedAt).toLocaleDateString() : ''}</td>
        </tr>`).join('')}
        </tbody>
      </table>`;
    }
    h += '</div>';

    // Section 2: Archive log
    h += `<div class="history-section">
      <div class="history-head">
        <div>
          <h2>Archive Log</h2>
          <p>Past archive batches (kept in Google Sheets forever).</p>
        </div>
      </div>`;
    if (archive.length === 0) {
      h += '<div class="empty-state" style="padding:30px"><p>No archives yet.</p></div>';
    } else {
      archive.forEach(b => {
        h += `<div class="archive-batch">
          <div>
            <div style="font-weight:600">${b.poCount} POs · ${b.loadCount} loads</div>
            <div class="batch-info">${b.batchId} · ${new Date(b.archivedAt).toLocaleString()} · by ${b.archivedBy}</div>
          </div>
          <span class="batch-status ${b.syncedToSheet ? 'synced' : 'local'}">${b.syncedToSheet ? '✓ Synced to Sheets' : '⚠ Local only'}</span>
        </div>`;
      });
    }
    h += '</div>';

    h += '</div>';
    wrap.innerHTML = h;
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state"><h3>Could not load history</h3><p style="color:var(--R)">${e.message}</p><button class="btn primary" onclick="renderHistory()" style="margin-top:12px">Retry</button></div>`;
  }
}

async function archiveToSheets() {
  if (!confirm('This will push all billed loads to Google Sheets (Archive tab) and remove them from the app.\n\nThis cannot be undone. Continue?')) return;
  toast('Archiving to Google Sheets...');
  const d = await api('POST', '/api/history/archive', {});
  if (d.ok) {
    toast(`Archived ${d.archived.loads} loads in batch ${d.archived.batchId}`, 'success');
    await loadAll();
    renderHistory();
  } else toast(d.error || 'Failed to archive', 'error');
}

// ── SHEETS SYNC ──────────────────────────────────────────────────────────────
async function syncSheets() {
  toast('Syncing to Google Sheets...');
  const d = await api('POST', '/api/sync', {});
  if (d.ok) toast(`Synced ${d.pos} POs and ${d.loads} loads`, 'success');
  else toast(d.error || 'Sync failed', 'error');
}

// ── START ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
