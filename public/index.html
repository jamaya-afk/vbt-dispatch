<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VBT Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --f:'Inter',system-ui,sans-serif;
  --bg:#fff;--bg2:#f4f6f9;--bg3:#eef1f6;
  --txt:#1a2035;--txt2:#5a6478;--txt3:#9ba5b7;
  --bdr:#e2e7f0;--bdr2:#cdd4e0;--r:10px;--rl:14px;
  --B:#3b82f6;--Bb:#eff6ff;--Bd:#bfdbfe;
  --G:#16a066;--Gb:#edfaf4;--Gd:#9fe4c8;
  --A:#d97706;--Ab:#fff8ed;--Ad:#fcd38a;
  --R:#e05252;--Rb:#fff0f0;--Rd:#f8b4b4;
  --P:#8b5cf6;--Pb:#f5f3ff;--Pd:#ddd6fe;
  --shadow:0 1px 3px rgba(26,32,53,.08), 0 1px 2px rgba(26,32,53,.04);
  --shadow-md:0 4px 12px rgba(26,32,53,.1), 0 2px 4px rgba(26,32,53,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);color:var(--txt);background:var(--bg3);overflow:hidden;height:100vh}

/* ── APP SHELL ── */
.shell{display:flex;height:100vh}
.sidebar{width:220px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--bdr);display:flex;flex-direction:column}
.sidebar-brand{padding:18px 16px;background:linear-gradient(135deg,#0a0e1a 0%,#1a2342 100%);min-height:82px;display:flex;align-items:center;justify-content:center}
.sidebar-brand img{max-width:170px;width:100%}
.sidebar-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;border-radius:var(--r);cursor:pointer;font-family:var(--f);font-size:13px;font-weight:500;color:var(--txt2);text-align:left;transition:background .12s;width:100%}
.nav-item:hover{background:var(--bg2);color:var(--txt)}
.nav-item.active{background:var(--Bb);color:var(--B);font-weight:600}
.nav-icon{width:18px;height:18px;flex-shrink:0;opacity:.8}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{background:var(--R);color:#fff;font-size:10px;padding:1px 7px;border-radius:20px;font-weight:700;margin-left:auto}
.sidebar-footer{border-top:1px solid var(--bdr);padding:12px}
.user-card{display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg2);border-radius:var(--r);margin-bottom:8px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--B);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.user-name{font-size:12px;font-weight:600;color:var(--txt)}
.user-role{font-size:10px;color:var(--txt3);text-transform:capitalize}
.signout-btn{width:100%;padding:7px 12px;background:transparent;border:1px solid var(--bdr2);border-radius:var(--r);color:var(--txt2);font-size:12px;cursor:pointer;font-family:var(--f);font-weight:500;transition:all .15s}
.signout-btn:hover{border-color:var(--R);color:var(--R);background:var(--Rb)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--bdr);flex-shrink:0;min-height:54px}
.page-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.menu-toggle{display:none;background:transparent;border:none;font-size:20px;cursor:pointer;padding:4px 8px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{padding:7px 14px;font-size:12px;font-weight:600;border-radius:20px;border:1.5px solid var(--bdr2);background:var(--bg2);color:var(--txt2);cursor:pointer;font-family:var(--f);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--txt);color:var(--txt)}
.btn.primary{background:var(--B);color:#fff;border-color:var(--B)}
.btn.primary:hover{background:#2563eb;border-color:#2563eb;color:#fff}
.btn.success{background:var(--G);color:#fff;border-color:var(--G)}
.btn.success:hover{background:#0d8a55;color:#fff}
.btn.danger{background:var(--Rb);color:var(--R);border-color:var(--Rd)}
.btn.danger:hover{background:var(--R);color:#fff}
.btn.ghost{background:transparent;border-color:var(--bdr2)}

.content{flex:1;overflow:auto;padding:0}
.section{display:none}
.section.active{display:block;min-height:100%}

/* ── BOARD ── */
.board-header{padding:14px 20px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.date-nav{display:flex;align-items:center;gap:6px}
.date-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bdr2);background:var(--bg);cursor:pointer;font-size:14px;color:var(--txt2)}
.date-nav button:hover{border-color:var(--B);color:var(--B)}
.date-label{font-size:14px;font-weight:600;min-width:200px;text-align:center}
.today-btn{font-size:11px;color:var(--B);background:var(--Bb);border:1px solid var(--Bd);padding:4px 10px;border-radius:20px;cursor:pointer;font-family:var(--f);font-weight:500}

.board{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;max-width:100%}
.driver-col{background:var(--bg);border-radius:var(--rl);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:200px}
.driver-col.unassigned-col{background:var(--Ab);border:1.5px dashed var(--Ad)}
.driver-col-head{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.driver-col.unassigned-col .driver-col-head{border-bottom-color:var(--Ad)}
.driver-name{font-size:13px;font-weight:700}
.driver-truck{font-size:11px;color:var(--txt3);margin-top:1px}
.driver-load-count{background:var(--bg2);font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;color:var(--txt2)}
.driver-col-body{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;transition:background .12s}
.driver-col-body.drop-target{background:var(--Bb)}

.lcard{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:10px 12px;cursor:grab;box-shadow:var(--shadow);transition:all .15s;position:relative}
.lcard:hover{box-shadow:var(--shadow-md);border-color:var(--Bd)}
.lcard.dragging{opacity:.5}
.lcard.submitted{border-color:var(--P);background:var(--Pb)}

/* ── STATUS-COLORED CARDS (Day + Month views) ── */
.lcard.is-completed,.mcard.is-completed{
  background:#e8f7ee;border-color:#9fe4c8;
}
.lcard.is-completed .lc-customer,.lcard.is-completed .lc-detail,
.lcard.is-completed .lc-progress span,
.mcard.is-completed .mcard-cust,.mcard.is-completed .mcard-mat{color:#0d5c3a}
.lcard.is-completed .lc-po,.mcard.is-completed .mcard-po{color:#0d5c3a}

.lcard.is-overdue,.mcard.is-overdue{
  background:#fde6e6;border-color:#f4a8a8;
}
.lcard.is-overdue .lc-customer,.lcard.is-overdue .lc-detail,
.lcard.is-overdue .lc-progress span,
.mcard.is-overdue .mcard-cust,.mcard.is-overdue .mcard-mat{color:#7a1a1a}
.lcard.is-overdue .lc-po,.mcard.is-overdue .mcard-po{color:#a82828}

.lcard.is-active,.mcard.is-active{
  background:#fff8ed;border-color:#fcd38a;
}
.lcard.is-active .lc-po,.mcard.is-active .mcard-po{color:#a86109}

/* Status pills */
.lc-status.is-completed{background:var(--G);color:#fff}
.lc-status.is-overdue{background:var(--R);color:#fff}
.lc-status.is-active{background:var(--A);color:#fff}
.lc-po{font-size:10px;font-weight:700;color:var(--B);letter-spacing:.04em;margin-bottom:3px}
.lc-customer{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:3px}
.lc-detail{font-size:11px;color:var(--txt2);margin-bottom:2px}
.lc-mat-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--Bb);color:var(--B);margin-top:4px}
.lc-progress{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px}
.lc-progress-bar{flex:1;height:4px;background:var(--bdr);border-radius:4px;overflow:hidden}
.lc-progress-fill{height:100%;background:var(--G);transition:width .3s}
.lc-status{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.lc-status.pending{background:var(--bg2);color:var(--txt2)}
.lc-status.submitted{background:var(--Pb);color:var(--P)}
.lc-status.approved{background:var(--Gb);color:var(--G)}
.lc-status.rejected{background:var(--Rb);color:var(--R)}

.empty-col{padding:20px;text-align:center;color:var(--txt3);font-size:11px;font-style:italic}

/* ── PO MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,32,53,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:200;overflow-y:auto}
.modal{background:var(--bg);border-radius:var(--rl);width:100%;max-width:560px;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{font-size:15px;font-weight:700}
.modal-close{background:var(--bg2);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--txt2)}
.modal-close:hover{background:var(--Rb);color:var(--R)}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:75vh;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--bdr);background:var(--bg2);display:flex;gap:8px;justify-content:flex-end;border-radius:0 0 var(--rl) var(--rl)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.field input,.field select,.field textarea{padding:9px 12px;border:1.5px solid var(--bdr2);border-radius:var(--r);background:var(--bg);font-family:var(--f);font-size:13px;color:var(--txt)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--B);box-shadow:0 0 0 3px var(--Bb)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.split-row{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:8px;align-items:end;padding:10px;background:var(--bg2);border-radius:var(--r);margin-bottom:6px}
.split-row .field label{font-size:10px}
.split-remove{background:var(--Rb);color:var(--R);border:1px solid var(--Rd);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
.split-add{padding:8px 14px;background:transparent;border:1.5px dashed var(--Bd);border-radius:var(--r);color:var(--B);font-family:var(--f);font-size:12px;font-weight:600;cursor:pointer}
.split-add:hover{background:var(--Bb)}

/* ── DRIVER MODE ── */
body.driver-mode .sidebar{display:none}
body.driver-mode .topbar{background:linear-gradient(135deg,#0a0e1a 0%,#1a2342 100%);border-bottom:none;color:#fff}
body.driver-mode .page-title{color:#fff}
body.driver-mode .topbar::before{content:'';display:inline-block;width:34px;height:34px;background:url(/app/logo.png) no-repeat center/contain;margin-right:6px;flex-shrink:0}
body.driver-mode .signout-btn,body.driver-mode .topbar-actions .btn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
body.driver-mode .signout-btn:hover,body.driver-mode .topbar-actions .btn:hover{border-color:#fca5a5;color:#fca5a5;background:rgba(220,38,38,.15)}

.drv-welcome{padding:18px 20px;background:linear-gradient(135deg,#1a2342 0%,#2d3a5e 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.drv-greeting{display:flex;align-items:center;gap:12px}
.drv-greeting .avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
.drv-hi{font-size:18px;font-weight:700;letter-spacing:-.01em}
.drv-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px}
.drv-stats{display:flex;gap:20px}
.drv-stat-num{font-size:22px;font-weight:700;line-height:1}
.drv-stat-lbl{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;font-weight:500}

.drv-trips{padding:14px;display:flex;flex-direction:column;gap:14px}
.trip-card{background:var(--bg);border:2px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow)}
.trip-card.is-today{border-color:var(--B)}
.trip-head{padding:14px 16px;background:linear-gradient(135deg,#1a2342 0%,#2d3a5e 100%);color:#fff}
.trip-po{font-size:11px;opacity:.7;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.trip-customer{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.today-badge{display:inline-block;font-size:10px;background:var(--G);padding:2px 8px;border-radius:20px;margin-left:8px;font-weight:700}

.trip-body{padding:16px}
.trip-info{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin-bottom:14px}
.trip-info dt{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;align-self:center}
.trip-info dd{font-size:13px;color:var(--txt);font-weight:500}
.trip-info .notes{color:var(--A);background:var(--Ab);padding:6px 10px;border-radius:var(--r);font-style:italic;border-left:3px solid var(--Ad)}

.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.step{flex:1;min-width:60px;text-align:center;padding:7px 4px;background:var(--bg2);border-radius:var(--r);font-size:10px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.step.active{background:var(--Bb);color:var(--B)}
.step.done{background:var(--Gb);color:var(--G)}
.step-time{display:block;font-size:9px;font-weight:400;margin-top:2px}

.trip-action{width:100%;padding:14px;font-size:15px;font-weight:700;border:none;border-radius:var(--rl);cursor:pointer;font-family:var(--f);margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;box-shadow:var(--shadow-md)}
.trip-action:active{transform:scale(.98)}
.trip-action.start{background:var(--B);color:#fff}
.trip-action.pickup{background:var(--A);color:#fff}
.trip-action.ticket{background:var(--A);color:#fff}
.trip-action.sign{background:var(--P);color:#fff}
.trip-action.complete{background:var(--G);color:#fff}
.trip-action svg{width:18px;height:18px}
.action-hint{text-align:center;font-size:11px;color:var(--txt3);margin-bottom:6px;font-weight:500}
.action-hint.required{color:var(--R);font-weight:600}

.req-check{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-radius:var(--r);margin-bottom:5px;font-size:12px}
.req-check.done{background:var(--Gb);color:var(--G);font-weight:500}
.req-check.missing{background:var(--Rb);color:var(--R)}

.banner{padding:10px 14px;border-radius:var(--r);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.banner.submitted{background:var(--Pb);color:var(--P);border:1px solid var(--Pd)}
.banner.approved{background:var(--Gb);color:var(--G);border:1px solid var(--Gd)}
.banner.rejected{background:var(--Rb);color:var(--R);border:1px solid var(--Rd)}

.ticket-preview{max-width:100%;border-radius:var(--r);margin:8px 0;border:1px solid var(--bdr)}

.empty-state{padding:60px 20px;text-align:center;color:var(--txt3)}
.empty-state h3{font-size:16px;color:var(--txt2);margin-bottom:6px;font-weight:600}
.empty-state p{font-size:13px}

/* ── APPROVALS ── */
.approve-list{padding:18px;display:flex;flex-direction:column;gap:14px}
.approve-card{background:var(--bg);border:1.5px solid var(--bdr);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow)}
.approve-head{padding:12px 16px;background:var(--Pb);border-bottom:1px solid var(--Pd);display:flex;justify-content:space-between;align-items:center}
.approve-body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.approve-body{grid-template-columns:1fr}}
.approve-info dt{font-size:11px;color:var(--txt3);text-transform:uppercase;font-weight:600;margin-top:8px}
.approve-info dt:first-child{margin-top:0}
.approve-info dd{font-size:13px;color:var(--txt);margin-top:2px}
.approve-image{max-width:100%;border-radius:var(--r);border:1px solid var(--bdr)}
.approve-actions{padding:12px 16px;border-top:1px solid var(--bdr);background:var(--bg2);display:flex;gap:8px;justify-content:flex-end}

/* ── BILLING ── */
.bill-filters{padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--bdr);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bill-filter{padding:6px 10px;font-size:12px;border:1px solid var(--bdr2);border-radius:var(--r);font-family:var(--f);background:var(--bg)}
.bill-list{padding:14px 18px}
.bill-table{width:100%;border-collapse:collapse;background:var(--bg);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow)}
.bill-table th{text-align:left;padding:10px 12px;background:var(--bg2);font-size:11px;font-weight:600;text-transform:uppercase;color:var(--txt2);border-bottom:1px solid var(--bdr)}
.bill-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--bdr)}
.bill-table tr:hover{background:var(--bg2)}
.bill-table input[type="checkbox"]{cursor:pointer;width:16px;height:16px}

/* ── REASSIGN MODAL ── */
.driver-pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--bdr);border-radius:var(--r);background:var(--bg);cursor:pointer;transition:all .15s;margin-bottom:6px}
.driver-pick:hover{border-color:var(--B);background:var(--Bb)}
.driver-pick.selected{border-color:var(--B);background:var(--Bb)}
.driver-pick.disabled{opacity:.45;cursor:not-allowed;background:var(--bg2)}
.driver-pick.disabled:hover{border-color:var(--bdr);background:var(--bg2)}
.driver-pick-avatar{width:32px;height:32px;border-radius:50%;background:var(--B);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.driver-pick-info{flex:1;min-width:0}
.driver-pick-name{font-size:13px;font-weight:600}
.driver-pick-detail{font-size:11px;color:var(--txt2);margin-top:1px}

/* ── MOVE DATE MODAL ── */
.move-scope-opt{padding:10px 12px;border:2px solid var(--bdr);border-radius:var(--r);cursor:pointer;background:var(--bg);transition:all .15s;display:flex;align-items:flex-start;gap:10px}
.move-scope-opt:hover{border-color:var(--B);background:var(--Bb)}
.move-scope-opt.selected{border-color:var(--B);background:var(--Bb)}
.move-scope-opt input[type="radio"]{margin-top:3px;flex-shrink:0;cursor:pointer}
.move-scope-opt .opt-title{font-weight:600;font-size:13px}
.move-scope-opt .opt-desc{font-size:11px;color:var(--txt2);margin-top:2px}
.move-scope-opt.disabled{opacity:.5;cursor:not-allowed}
.move-scope-opt.disabled:hover{border-color:var(--bdr);background:var(--bg)}

/* Move history pill on cards */
.lc-moved-pill{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:1px 7px;border-radius:20px;background:var(--Ab);color:var(--A);font-weight:700;border:1px solid var(--Ad);margin-top:5px;cursor:help}
.move-history-list{margin-top:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--r);font-size:11px}
.move-history-item{padding:4px 0;color:var(--txt2);border-bottom:1px dashed var(--bdr)}
.move-history-item:last-child{border-bottom:none}

/* ── VIEW TOGGLE (Day / Month) ── */
.view-btn{padding:5px 12px;font-size:11px;font-weight:600;color:var(--txt2);background:transparent;border:none;border-radius:18px;cursor:pointer;font-family:var(--f);transition:all .15s}
.view-btn:hover{color:var(--txt)}
.view-btn.active{background:var(--B);color:#fff}

/* ── MONTH VIEW ── */
.month-grid{padding:18px}
.month-grid table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow)}
.month-grid th{background:var(--bg2);padding:10px 8px;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt2);letter-spacing:.04em;border-bottom:1px solid var(--bdr);text-align:left}
.month-grid th.day-col{width:90px}
.month-grid td{padding:6px;border-bottom:1px solid var(--bdr);vertical-align:top;min-height:90px}
.month-grid td.day-cell{background:var(--bg2);font-weight:600;cursor:pointer;text-align:center;width:90px}
.month-grid td.day-cell:hover{background:var(--Bb)}
.month-grid td.day-cell.today-cell{background:var(--B);color:#fff}
.month-grid td.day-cell.past-cell{opacity:.55}
.day-num{font-size:20px;font-weight:700;line-height:1;display:block;margin-bottom:2px}
.day-name{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
.today-cell .day-name{color:rgba(255,255,255,.8)}
.day-summary{font-size:10px;color:var(--txt3);margin-top:3px}
.today-cell .day-summary{color:rgba(255,255,255,.8)}
.day-warn{display:inline-block;font-size:9px;color:#fff;background:var(--R);padding:1px 6px;border-radius:20px;font-weight:700;margin-top:3px}
.mcard{background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);padding:6px 8px;margin-bottom:4px;font-size:11px;cursor:pointer;transition:box-shadow .15s}
.mcard:hover{box-shadow:var(--shadow);border-color:var(--Bd)}
.mcard.unassigned-m{border-color:var(--Ad);background:var(--Ab)}
.mcard.completed-m{opacity:.55}
.mcard-po{font-size:9px;font-weight:700;color:var(--B);letter-spacing:.04em}
.mcard-cust{font-size:11px;font-weight:600;line-height:1.3;margin-top:1px}
.mcard-mat{font-size:10px;color:var(--txt2);margin-top:2px}
.mcard-progress{font-size:10px;color:var(--txt3);font-weight:600;margin-top:2px}
.mempty{padding:8px;text-align:center;color:var(--txt3);font-size:10px;font-style:italic}

/* ── YARD PICKER ── */
.yard-card{display:flex;align-items:center;gap:12px;padding:14px 15px;border:2px solid var(--bdr);border-radius:var(--r);background:var(--bg);cursor:pointer;transition:all .15s;margin-bottom:8px}
.yard-card:hover{border-color:var(--B);background:var(--Bb)}
.yard-card.preset{border-color:var(--G);background:var(--Gb)}
.yard-icon{width:42px;height:42px;border-radius:var(--r);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.yard-name{font-size:14px;font-weight:600}
.yard-loc{font-size:11px;color:var(--txt2);margin-top:2px}
.yard-tag{font-size:10px;color:var(--G);background:var(--Gb);padding:1px 8px;border-radius:20px;font-weight:700;display:inline-block;margin-top:4px;border:1px solid var(--Gd)}

/* ── REPORTS / FINANCE ── */
.reports-wrap{padding:18px}
.reports-wrap h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);font-weight:700;margin:18px 0 10px}
.reports-wrap h3:first-child{margin-top:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:var(--bg);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:700;color:var(--txt);line-height:1}
.stat-lbl{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;font-weight:600}
.stat-num.green{color:var(--G)}
.stat-num.amber{color:var(--A)}
.stat-num.blue{color:var(--B)}
.report-table{width:100%;border-collapse:collapse;background:var(--bg);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.report-table th,.report-table td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--bdr)}
.report-table th{background:var(--bg2);font-size:11px;text-transform:uppercase;color:var(--txt2);font-weight:600;letter-spacing:.04em}

.bar-row{display:flex;align-items:center;gap:8px}

.bar-fill{height:100%;border-radius:3px}
.weekly-chart{display:flex;gap:6px;align-items:flex-end;height:120px;padding:0 4px;background:var(--bg);border-radius:var(--rl);padding:14px;box-shadow:var(--shadow)}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-bar-wrap{width:100%;background:var(--Bd);border-radius:4px 4px 0 0;height:80px;position:relative;overflow:hidden}
.week-bar-fill{position:absolute;bottom:0;width:100%;background:var(--G);border-radius:4px 4px 0 0;transition:height .3s}
.week-num{font-size:11px;color:var(--txt2);font-weight:600}
.week-lbl{font-size:9px;color:var(--txt3)}

/* ── HISTORY ── */
.history-wrap{padding:18px}
.history-section{background:var(--bg);border-radius:var(--rl);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.history-head{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.history-head h2{font-size:15px;font-weight:700}

.batch-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.batch-status.synced{background:var(--Gb);color:var(--G)}
.batch-status.local{background:var(--Ab);color:var(--A)}

/* ── SIMPLER APPROVAL CARDS ── */
.approve-list{padding:18px;display:flex;flex-direction:column;gap:10px}

.am-info{flex:1;min-width:200px}
.am-po{font-size:10px;color:var(--P);font-weight:700;letter-spacing:.04em}

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
let me = null, role = 'driver', myTruckId = null, myUsername = '';
let trucks = [], materials = [], yards = [], pos = [], loads = [];
let dayOffset = 0, monthOffset = 0;
let boardView = 'day';  // 'day' | 'month'
let currentTab = 'board';
let editingPoId = null;
let splits = [];
let currentLoadId = null;  // for ticket/sig modals

// ── HELPERS ──────────────────────────────────────────────────────────────────
// Local-date string (NOT UTC) — important for color status logic so loads don't go red early
const todayStr = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

// Card status logic — drives green/red/normal coloring
// Returns: { kind: 'completed'|'overdue'|'active'|'normal', label: string }
function getCardStatus(l) {
  const today = todayStr();
  const sched = l.deliveryDate || '';
  const ts = l.timestamps || {};

  // 1. Completed (delivered/submitted/approved/billed) — always green regardless of date
  if (l.approvalStatus === 'approved' || l.billStatus === 'billed') {
    return { kind: 'completed', label: 'Approved' };
  }
  if (l.approvalStatus === 'submitted' || ts.completed) {
    return { kind: 'completed', label: 'Delivered' };
  }
  // Rejected stands out so it can be re-done
  if (l.approvalStatus === 'rejected') {
    return { kind: 'overdue', label: 'Rejected' };
  }

  // 2. In progress today (started but not done) — amber
  if (sched === today && ts.start) {
    return { kind: 'active', label: 'In progress' };
  }

  // 3. Overdue — scheduled date is today or earlier and not completed/in-progress
  if (sched && sched < today) {
    return { kind: 'overdue', label: 'Overdue' };
  }
  if (sched === today && !ts.start) {
    // It's today but not yet started — leave it normal until end of day
    // The "overdue" status only kicks in for past dates (sched < today)
    return { kind: 'normal', label: 'Today' };
  }

  // 4. Future — normal
  return { kind: 'normal', label: 'Scheduled' };
}
function getBoardDate() {
  const d = new Date();
  d.setDate(d.getDate() + dayOffset);
  return d;
}
function ymd(d) { return d.toISOString().slice(0, 10); }
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function api(method, url, body) {
  return fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.json().then(d => ({ ok: r.ok, status: r.status, ...d })));
}
async function loadAll() {
  try {
    const r = await fetch('/api/data');
    if (!r.ok) {
      console.error('loadAll: /api/data returned', r.status);
      return;
    }
    const d = await r.json();
    trucks = d.trucks || [];
    materials = d.materials || [];
    yards = d.yards || [];
    pos = d.pos || [];
    loads = d.loads || [];
    console.log('[loadAll] trucks:', trucks.length, 'materials:', materials.length, 'pos:', pos.length, 'loads:', loads.length);
  } catch (e) {
    console.error('loadAll error:', e);
  }
}

// ── GPS TRACKING (background, drivers only) ─────────────────────────────────
function startGPSTracking() {
  if (!navigator.geolocation || !navigator.geolocation.watchPosition) return;
  try {
    navigator.geolocation.watchPosition(
      (pos) => {
        // Send GPS to server (best-effort, don't block on errors)
        fetch('/api/driver-location', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          })
        }).catch(() => {});
      },
      (err) => { console.warn('[GPS] watch error:', err.message); },
      { enableHighAccuracy: true, maximumAge: 30000, timeout: 10000 }
    );
  } catch (e) {
    console.warn('[GPS] startGPSTracking failed:', e.message);
  }
}

// ── BOARD (manager) ──────────────────────────────────────────────────────────
function setBoardView(v) {
  boardView = v;
  renderBoard();
}

function renderBoard() {
  if (boardView === 'month') return renderMonthBoard();
  return renderDayBoard();
}

function renderDayBoard() {
  const date = getBoardDate();
  const dateStr = ymd(date);
  const isToday = dateStr === todayStr();

  // Header with date nav
  document.getElementById('board-header').innerHTML = `
    <div class="date-nav">
      <button onclick="changeDay(-1)">‹</button>
      <span class="date-label">${date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</span>
      <button onclick="changeDay(1)">›</button>
    </div>
    ${!isToday ? `<button class="today-btn" onclick="goToday()">Today</button>` : ''}
    <div style="margin-left:auto;display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:20px">
      <button class="view-btn ${boardView === 'day' ? 'active' : ''}" onclick="setBoardView('day')">Day</button>
      <button class="view-btn ${boardView === 'month' ? 'active' : ''}" onclick="setBoardView('month')">Month</button>
    </div>
  `;

  // Build board: column per driver + unassigned
  const board = document.getElementById('board');
  const cols = [];

  trucks.forEach(t => {
    const myLoads = loads.filter(l => l.truckId === t.id && l.deliveryDate === dateStr && !l.voided);
    const reassignableCount = myLoads.filter(l => !l.locked).length;
    cols.push(`
      <div class="driver-col">
        <div class="driver-col-head">
          <div style="flex:1;min-width:0">
            <div class="driver-name">${t.label}</div>
            <div class="driver-truck">${t.truckNum}${reassignableCount > 0 ? ` · <a onclick="event.stopPropagation();openReassignModal('all-driver','${t.id}')" style="color:var(--B);cursor:pointer;text-decoration:underline;font-weight:500">Reassign all</a>` : ''}</div>
          </div>
          <span class="driver-load-count">${myLoads.length}</span>
        </div>
        <div class="driver-col-body" data-truckid="${t.id}"
          ondragover="event.preventDefault();this.classList.add('drop-target')"
          ondragleave="this.classList.remove('drop-target')"
          ondrop="onDrop(event, '${t.id}')">
          ${myLoads.length ? myLoads.map(l => loadCard(l)).join('') : '<div class="empty-col">No loads</div>'}
        </div>
      </div>
    `);
  });

  // Unassigned column
  const unas = loads.filter(l => (!l.truckId || l.truckId === 'unassigned') && l.deliveryDate === dateStr && !l.voided);
  cols.push(`
    <div class="driver-col unassigned-col">
      <div class="driver-col-head">
        <div>
          <div class="driver-name" style="color:var(--A)">⚠ Unassigned</div>
          <div class="driver-truck">Drag a card here to unassign</div>
        </div>
        <span class="driver-load-count" style="background:var(--Ad);color:var(--A)">${unas.length}</span>
      </div>
      <div class="driver-col-body" data-truckid=""
        ondragover="event.preventDefault();this.classList.add('drop-target')"
        ondragleave="this.classList.remove('drop-target')"
        ondrop="onDrop(event, '')">
        ${unas.length ? unas.map(l => loadCard(l)).join('') : '<div class="empty-col">No unassigned loads</div>'}
      </div>
    </div>
  `);

  board.innerHTML = cols.join('');
  updateApproveBadge();
}

// ── MONTH BOARD ──
function renderMonthBoard() {
  const today = new Date();
  const target = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const daysInMonth = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  const todStr = todayStr();
  const monthLabel = target.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // Header
  document.getElementById('board-header').innerHTML = `
    <div class="date-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="date-label">${monthLabel}</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    ${monthOffset !== 0 ? `<button class="today-btn" onclick="goToday()">Today</button>` : ''}
    <div style="margin-left:auto;display:flex;gap:4px;background:var(--bg2);padding:3px;border-radius:20px">
      <button class="view-btn ${boardView === 'day' ? 'active' : ''}" onclick="setBoardView('day')">Day</button>
      <button class="view-btn ${boardView === 'month' ? 'active' : ''}" onclick="setBoardView('month')">Month</button>
    </div>
  `;

  let h = '<div class="month-grid"><table>';
  // Header row
  h += '<thead><tr><th class="day-col">Date</th>';
  trucks.forEach(t => { h += `<th>${t.label}<div style="font-size:10px;font-weight:400;color:var(--txt3)">${t.truckNum}</div></th>`; });
  h += '<th style="width:90px;color:var(--A)">⚠ Unassigned</th>';
  h += '</tr></thead><tbody>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(target.getFullYear(), target.getMonth(), d);
    const dateStr = ymd(dt);
    const dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
    const isToday = dateStr === todStr;
    const isPast = dateStr < todStr;
    const dayLoads = loads.filter(l => l.deliveryDate === dateStr && !l.voided);
    const totalAssigned = dayLoads.reduce((s,l) => s + (Number(l.loadsAssigned)||0), 0);
    const totalDelivered = dayLoads.reduce((s,l) => s + (Number(l.loadsDelivered)||0), 0);
    const unas = dayLoads.filter(l => !l.truckId || l.truckId === 'unassigned');

    h += `<tr>`;
    h += `<td class="day-cell ${isToday ? 'today-cell' : ''} ${isPast && !isToday ? 'past-cell' : ''}" onclick="jumpToDay('${dateStr}')">
      <span class="day-num">${d}</span>
      <span class="day-name">${dayName}</span>
      ${dayLoads.length ? `<div class="day-summary">${totalDelivered}/${totalAssigned}</div>` : ''}
      ${unas.length ? `<span class="day-warn">${unas.length}</span>` : ''}
    </td>`;

    trucks.forEach(t => {
      const myLoads = dayLoads.filter(l => l.truckId === t.id);
      h += '<td>';
      if (myLoads.length === 0) h += '<div class="mempty">—</div>';
      else {
        myLoads.slice(0, 3).forEach(l => {
          const po = pos.find(p => p.id === l.poId) || {};
          const status = getCardStatus(l);
          h += `<div class="mcard is-${status.kind}" onclick="openLoadDetail('${l.id}')">
            <div class="mcard-po">${po.poNumber || ''}</div>
            <div class="mcard-cust">${po.customer || ''}</div>
            <div class="mcard-mat">${l.material}</div>
            <div class="mcard-progress">${l.loadsDelivered}/${l.loadsAssigned} loads</div>
          </div>`;
        });
        if (myLoads.length > 3) h += `<div class="mempty" onclick="jumpToDay('${dateStr}')" style="cursor:pointer;color:var(--B)">+${myLoads.length - 3} more</div>`;
      }
      h += '</td>';
    });

    // Unassigned column
    h += '<td>';
    if (unas.length === 0) h += '<div class="mempty">—</div>';
    else {
      unas.slice(0, 2).forEach(l => {
        const po = pos.find(p => p.id === l.poId) || {};
        h += `<div class="mcard unassigned-m" onclick="openLoadDetail('${l.id}')">
          <div class="mcard-po">${po.poNumber || ''}</div>
          <div class="mcard-cust">${po.customer || ''}</div>
          <div class="mcard-mat">${l.material}</div>
        </div>`;
      });
      if (unas.length > 2) h += `<div class="mempty">+${unas.length - 2}</div>`;
    }
    h += '</td>';
    h += '</tr>';
  }
  h += '</tbody></table></div>';

  document.getElementById('board').innerHTML = h;
  updateApproveBadge();
}

function changeMonth(n) { monthOffset += n; renderBoard(); }
function jumpToDay(dateStr) {
  // Set dayOffset to land on dateStr
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T12:00:00');
  dayOffset = Math.round((target - today) / 86400000);
  setBoardView('day');
}

function loadCard(l) {
  const po = pos.find(p => p.id === l.poId) || {};
  const pct = l.loadsAssigned > 0 ? Math.round(l.loadsDelivered / l.loadsAssigned * 100) : 0;
  const status = getCardStatus(l);
  const cardCls = `is-${status.kind}`;

  const wasMoved = l.moveHistory && l.moveHistory.length > 0;
  const lastMove = wasMoved ? l.moveHistory[l.moveHistory.length - 1] : null;

  return `<div class="lcard ${cardCls}"
    draggable="${role === 'manager' && !l.locked ? 'true' : 'false'}"
    data-loadid="${l.id}"
    ondragstart="onDragStart(event, '${l.id}')"
    ondragend="this.classList.remove('dragging')"
    onclick="openLoadDetail('${l.id}')">
    <span class="lc-status ${cardCls}">${status.label}</span>
    <div class="lc-po">${po.poNumber || '—'}</div>
    <div class="lc-customer">${po.customer || ''}</div>
    ${po.city ? `<div class="lc-detail">📍 ${po.city}</div>` : ''}
    <div class="lc-mat-pill">${l.material} · ${l.loadsAssigned} loads</div>
    <div class="lc-progress">
      <span>${l.loadsDelivered}/${l.loadsAssigned}</span>
      <div class="lc-progress-bar"><div class="lc-progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${wasMoved ? `<span class="lc-moved-pill" title="Moved from ${fmtDate(lastMove.from)} — ${lastMove.reason}">📅 Moved</span>` : ''}
  </div>`;
}

function changeDay(n) { dayOffset += n; renderBoard(); }
function goToday() { dayOffset = 0; monthOffset = 0; renderBoard(); }

// ── DRAG & DROP ──────────────────────────────────────────────────────────────
let dragId = null;
function onDragStart(e, id) {
  dragId = id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
async function onDrop(e, truckId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-target');
  if (!dragId) return;
  const d = await api('PUT', '/api/loads/' + dragId, { truckId: truckId || null });
  if (d.ok) { await loadAll(); renderBoard(); toast('Load reassigned', 'success'); }
  else toast(d.error || 'Failed', 'error');
  dragId = null;
}

async function savePO() {
  const po = {
    poNumber:     document.getElementById('po-number').value.trim() || null,
    customer:     document.getElementById('po-customer').value.trim(),
    job:          document.getElementById('po-customer').value.trim(),
    deliveryDate: document.getElementById('po-date').value,
    address:      document.getElementById('po-address').value.trim(),
    city:         document.getElementById('po-city').value.trim(),
    pickup:       document.getElementById('po-pickup').value.trim() || 'VBT Yard',
    notes:        document.getElementById('po-notes').value.trim(),
  };

// ── LOAD DETAIL (manager click on card) ─────────────────────────────────────

  let html = `<div style="font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:4px">${po.poNumber}</div>`;
  html += `<div style="font-size:18px;font-weight:700;margin-bottom:10px">${po.customer}</div>`;
  html += `<dl style="display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px">`;
  html += `<dt style="color:var(--txt3)">Material</dt><dd>${l.material}</dd>`;
  html += `<dt style="color:var(--txt3)">Loads</dt><dd>${l.loadsDelivered}/${l.loadsAssigned}</dd>`;
  html += `<dt style="color:var(--txt3)">Driver</dt><dd>${l.driverName || 'Unassigned'}</dd>`;
  html += `<dt style="color:var(--txt3)">Date</dt><dd>${fmtDate(l.deliveryDate)}</dd>`;
  if (po.address) html += `<dt style="color:var(--txt3)">Address</dt><dd>${po.address}, ${po.city || ''}</dd>`;
  if (po.pickup) html += `<dt style="color:var(--txt3)">Pickup</dt><dd>${po.pickup}</dd>`;
  if (po.notes) html += `<dt style="color:var(--txt3)">Notes</dt><dd>${po.notes}</dd>`;
  html += `<dt style="color:var(--txt3)">Status</dt><dd>${l.approvalStatus}</dd>`;
  html += `</dl>`;

  if (l.ticketImage) html += `<div style="margin-top:12px"><div style="font-size:11px;color:var(--txt3);text-transform:uppercase;font-weight:600;margin-bottom:4px">Ticket</div><img src="${l.ticketImage}" style="max-width:100%;border-radius:var(--r);border:1px solid var(--bdr)"></div>`;
  if (l.pod?.signature) html += `<div style="margin-top:12px"><div style="font-size:11px;color:var(--txt3);text-transform:uppercase;font-weight:600;margin-bottom:4px">Signed by ${l.pod.signedBy}</div><img src="${l.pod.signature}" style="max-width:100%;border-radius:var(--r);border:1px solid var(--bdr);background:#fff"></div>`;

  // Show move history if any
  if (l.moveHistory && l.moveHistory.length) {
    html += `<div class="move-history-list">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);font-weight:600;margin-bottom:4px">Move History</div>

      actions += `<button class="btn danger" onclick="if(confirm('Delete this load?')){deleteLoad('${l.id}')}">Delete Load</button>`;
    }

  showInfoModal('Load Details', html, actions);
