<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>VBT Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --bg:#fff;--bg2:#f7f6f2;--bg3:#f0efe9;
  --txt:#111;--txt2:#666;--txt3:#aaa;
  --bdr:#e0dfd8;--bdr2:#c8c7bf;
  --rad:8px;--radl:12px;
  --green:#1a7a4a;--green-bg:#eaf7f0;--green-bdr:#a3d9bc;
  --amber:#8a5c00;--amber-bg:#fff8e6;--amber-bdr:#f0d080;
  --red:#c0392b;--red-bg:#fdf0ee;--red-bdr:#f0b0a8;
  --blue:#1a5fa8;--blue-bg:#eaf2fd;--blue-bdr:#90bce8;
  --purple:#6c3fc5;--purple-bg:#f3eeff;--purple-bdr:#c4a8f0;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#242420;--bg3:#2e2e28;
  --txt:#f0efe9;--txt2:#aaa9a0;--txt3:#555550;
  --bdr:#38382f;--bdr2:#4a4a40;
  --green:#3dd68c;--green-bg:#0d2e1e;--green-bdr:#1a5c3a;
  --amber:#f0c040;--amber-bg:#2a2000;--amber-bdr:#6a4e00;
  --red:#f07060;--red-bg:#2e0e0a;--red-bdr:#6a2820;
  --blue:#60a8f0;--blue-bg:#0a1e36;--blue-bdr:#1a4a80;
  --purple:#c4a8f0;--purple-bg:#1e1030;--purple-bdr:#6c3fc5;
}}
body{font-family:var(--font);background:var(--bg3);color:var(--txt);min-height:100vh}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:0.5px solid var(--bdr2);flex-wrap:wrap;position:sticky;top:0;z-index:50}
.topbar h1{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--txt);flex:1;min-width:120px}
.tab-btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--bdr2);border-radius:var(--rad);background:transparent;cursor:pointer;color:var(--txt2);font-family:var(--font);white-space:nowrap}
.tab-btn.active{background:var(--txt);color:var(--bg);border-color:transparent}
.week-nav{display:flex;align-items:center;gap:5px}
.wbtn{border:0.5px solid var(--bdr2);background:transparent;cursor:pointer;color:var(--txt2);font-size:12px;padding:5px 10px;border-radius:var(--rad);font-family:var(--font)}
.wbtn:hover{background:var(--bg2)}
.week-label{font-family:var(--mono);font-size:11px;color:var(--txt);min-width:124px;text-align:center}
.sync-btn{padding:5px 12px;font-size:12px;border:0.5px solid var(--blue-bdr);border-radius:var(--rad);background:transparent;cursor:pointer;color:var(--blue);font-family:var(--font)}
.sync-btn:hover{background:var(--blue-bg)}
.sync-btn:disabled{opacity:.5;cursor:not-allowed}
.sync-status{font-size:11px;font-family:var(--mono);color:var(--txt2)}
.sync-status.ok{color:var(--green)}.sync-status.err{color:var(--red)}
.user-info{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.logout-btn{font-size:11px;color:var(--txt3);background:transparent;border:none;cursor:pointer;font-family:var(--font);text-decoration:underline}
.manager-only{display:none}
body.is-manager .manager-only{display:flex}

/* SUMMARY */
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:12px 14px;background:var(--bg);border-bottom:0.5px solid var(--bdr)}
.metric{background:var(--bg2);border-radius:var(--rad);padding:10px 12px}
.metric .ml{font-size:10px;color:var(--txt2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.metric .mv{font-size:22px;font-weight:500;font-family:var(--mono);color:var(--txt)}
.metric.warn .mv{color:var(--red)}
.metric.info .mv{color:var(--blue)}
.metric.sched .mv{color:var(--purple)}

/* MISSING PANEL */
.missing-wrap{padding:12px 14px 0}
.missing-panel{border:0.5px solid var(--red-bdr);border-radius:var(--radl);background:var(--bg);overflow:hidden}
.missing-head{padding:10px 14px;background:var(--red-bg);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.missing-head .mh-title{font-size:13px;font-weight:500;color:var(--red)}
.missing-head .mh-toggle{font-size:11px;color:var(--red);opacity:.7}
.missing-list{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.missing-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg2);border-radius:var(--rad);font-size:12px;cursor:pointer}
.missing-item:hover{background:var(--bg3)}
.mi-cust{font-weight:500;color:var(--txt)}
.mi-meta{color:var(--txt2);font-size:11px;margin-top:1px}
.mi-badge{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--red);white-space:nowrap}

/* MANAGER GRID */
.manager-view{overflow-x:auto;padding:12px 14px 20px}
.grid-wrap{min-width:700px;border-radius:var(--radl);border:0.5px solid var(--bdr2);overflow:hidden;background:var(--bg)}
.day-label-row{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--txt);color:var(--bg)}
.dlday{font-family:var(--mono);font-size:13px;font-weight:500}
.dldate{font-size:11px;opacity:.55;font-family:var(--mono)}
.col-header-row{display:grid;background:var(--bg2);border-bottom:0.5px solid var(--bdr2)}
.col-hdr{padding:6px 8px;font-size:10px;font-weight:500;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;border-right:0.5px solid var(--bdr);display:flex;flex-direction:column;gap:3px}
.col-hdr:last-child{border-right:none}
.truck-label{font-size:11px;color:var(--txt);font-weight:500}
.truck-num-input{font-family:var(--mono);font-size:10px;background:transparent;border:0.5px solid transparent;border-radius:4px;color:var(--txt2);width:100%;padding:2px 4px;cursor:pointer}
.truck-num-input:hover{border-color:var(--bdr2)}
.truck-num-input:focus{border-color:var(--bdr2);background:var(--bg);outline:none;color:var(--txt)}
.jobs-cols{display:grid;border-bottom:0.5px solid var(--bdr)}
.truck-col{border-right:0.5px solid var(--bdr);min-height:60px;padding:5px 0}
.truck-col:last-child{border-right:none}
.job-card{margin:3px 6px;padding:7px 9px;border-radius:var(--rad);border:0.5px solid var(--bdr);background:var(--bg);cursor:pointer;transition:background .1s}
.job-card:hover{background:var(--bg2)}
.job-card.missing{border-color:var(--red-bdr);background:var(--red-bg)}
.job-card.is-recurring{border-left:3px solid var(--purple)}
.jc-cust{font-size:11px;font-weight:500;color:var(--txt);line-height:1.3}
.jc-sub{font-size:10px;color:var(--txt2);margin-top:2px;font-family:var(--mono)}
.jc-pills{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pill{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--bg2);color:var(--txt2);border:0.5px solid var(--bdr);white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green);border-color:var(--green-bdr)}
.pill.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bdr)}
.pill.red{background:var(--red-bg);color:var(--red);border-color:var(--red-bdr)}
.pill.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bdr)}
.pill.purple{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-bdr)}
.add-btn{margin:3px 6px;padding:5px 7px;width:calc(100% - 12px);border:0.5px dashed var(--bdr2);border-radius:var(--rad);background:transparent;cursor:pointer;font-size:10px;color:var(--txt3);font-family:var(--font);text-align:left}
.add-btn:hover{background:var(--bg2);color:var(--txt2)}

/* SCHEDULED QUEUE */
.sched-section{padding:12px 14px}
.sched-header{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sched-count{font-size:11px;font-family:var(--mono);color:var(--purple);background:var(--purple-bg);padding:2px 8px;border-radius:20px}
.sched-list{display:flex;flex-direction:column;gap:8px}
.sched-card{background:var(--bg);border:0.5px solid var(--purple-bdr);border-radius:var(--radl);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.sched-card:hover{background:var(--purple-bg)}
.sc-left .sc-cust{font-size:13px;font-weight:500;color:var(--txt)}
.sc-left .sc-meta{font-size:11px;color:var(--txt2);margin-top:3px}
.sc-date{font-family:var(--mono);font-size:12px;color:var(--purple);text-align:right;white-space:nowrap}
.sc-days{font-size:10px;color:var(--txt3);margin-top:2px;text-align:right}

/* HISTORY */
.history-section{padding:12px 14px 24px}
.history-header{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.history-count{font-size:11px;font-family:var(--mono);color:var(--green);background:var(--green-bg);padding:2px 8px;border-radius:20px}
.history-month{margin-bottom:16px}
.history-month-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt2);font-weight:500;margin-bottom:6px;padding-bottom:4px;border-bottom:0.5px solid var(--bdr)}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg);border:0.5px solid var(--bdr);border-radius:var(--rad);margin-bottom:5px}
.hi-left .hi-cust{font-size:12px;font-weight:500;color:var(--txt)}
.hi-left .hi-meta{font-size:11px;color:var(--txt2);margin-top:2px}
.hi-right{text-align:right}
.hi-date{font-size:11px;font-family:var(--mono);color:var(--green)}
.hi-loads{font-size:11px;color:var(--txt2)}

/* DRIVER VIEW */
.driver-view{padding:14px}
.driver-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.driver-bar label{font-size:13px;color:var(--txt2)}
select{font-size:13px;padding:7px 10px;border:0.5px solid var(--bdr2);border-radius:var(--rad);background:var(--bg);color:var(--txt);font-family:var(--font)}
.drv-day{border:0.5px solid var(--bdr2);border-radius:var(--radl);background:var(--bg);overflow:hidden;margin-bottom:10px}
.drv-day-head{padding:9px 14px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid var(--bdr)}
.dday{font-size:13px;font-weight:500;color:var(--txt)}
.dtot{font-size:12px;color:var(--txt2);font-family:var(--mono)}
.dtot.warn{color:var(--red)}
.drv-jobs{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.drv-job{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;border:0.5px solid var(--bdr);border-radius:var(--rad);background:var(--bg2);align-items:start}
.drv-job.missing{border-color:var(--red-bdr)}
.djl .cust{font-size:13px;font-weight:500;color:var(--txt)}
.djl .meta{font-size:11px;color:var(--txt2);margin-top:4px;line-height:1.7}
.djr{text-align:right;min-width:70px}
.djr .big{font-size:22px;font-weight:500;font-family:var(--mono);color:var(--txt)}
.djr .lbl{font-size:10px;color:var(--txt3)}
.log-btn{margin-top:8px;padding:5px 11px;font-size:11px;border:0.5px solid var(--bdr2);border-radius:var(--rad);background:var(--bg);cursor:pointer;color:var(--txt2);font-family:var(--font);display:block;width:100%}
.log-btn:hover{background:var(--txt);color:var(--bg)}
.complete-btn{margin-top:5px;padding:5px 11px;font-size:11px;border:0.5px solid var(--green-bdr);border-radius:var(--rad);background:var(--green-bg);cursor:pointer;color:var(--green);font-family:var(--font);display:block;width:100%}
.complete-btn:hover{background:var(--green);color:#fff}
.no-jobs{padding:24px;text-align:center;font-size:13px;color:var(--txt3)}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;z-index:200;overflow-y:auto}
.modal{background:var(--bg);border-radius:var(--radl);border:0.5px solid var(--bdr2);width:100%;max-width:520px;margin:auto}
.modal-head{padding:13px 16px;border-bottom:0.5px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:14px;font-weight:500;font-family:var(--mono);color:var(--txt)}
.mclose{background:transparent;border:none;cursor:pointer;font-size:22px;color:var(--txt2);line-height:1}
.mbody{padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:0.5px solid var(--bdr2);border-radius:var(--rad);background:var(--bg);color:var(--txt);font-size:13px;font-family:var(--font)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--txt2)}
.fld textarea{resize:vertical;min-height:56px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{padding:11px 16px;border-top:0.5px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.btn-p{padding:8px 18px;background:var(--txt);color:var(--bg);border:none;border-radius:var(--rad);cursor:pointer;font-size:13px;font-family:var(--font)}
.btn-p:hover{opacity:.85}
.btn-s{padding:8px 18px;background:transparent;color:var(--txt2);border:0.5px solid var(--bdr2);border-radius:var(--rad);cursor:pointer;font-size:13px;font-family:var(--font)}
.btn-d{padding:7px 14px;background:transparent;color:var(--red);border:0.5px solid var(--red-bdr);border-radius:var(--rad);cursor:pointer;font-size:12px;font-family:var(--font);margin-right:auto}
.recurrence-row{display:none}
.recurrence-row.show{display:grid}
.ts-row{display:flex;align-items:center;gap:8px}
.ts-btn{padding:5px 10px;font-size:11px;border:0.5px solid var(--bdr2);border-radius:var(--rad);background:var(--bg2);color:var(--txt2);cursor:pointer;font-family:var(--font);white-space:nowrap}
.ts-btn:hover{background:var(--txt);color:var(--bg)}
.ts-input{flex:1;padding:5px 8px;font-size:11px;font-family:var(--mono);border:0.5px solid var(--bdr);border-radius:var(--rad);background:var(--bg2);color:var(--txt2)}
.move-reassign{display:none;flex-direction:column;gap:8px;padding:12px 16px;border-top:0.5px solid var(--bdr);background:var(--bg2)}
.move-reassign.show{display:flex}
.move-reassign .mr-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2)}
@media(max-width:600px){.frow{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <h1>VBT Dispatch</h1>
  <div class="week-nav" id="week-nav-wrap">
    <button class="wbtn" onclick="changeWeek(-1)">&#8592;</button>
    <span class="week-label" id="week-label"></span>
    <button class="wbtn" onclick="changeWeek(1)">&#8594;</button>
  </div>
  <button class="tab-btn active" id="tab-mgr" onclick="switchTab('manager')">Schedule</button>
  <button class="tab-btn" id="tab-queue" onclick="switchTab('queue')">Scheduled</button>
  <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
  <button class="tab-btn" id="tab-drv" onclick="switchTab('driver')">My Jobs</button>
  <button class="sync-btn manager-only" id="sync-btn" onclick="syncToSheets()">&#8593; Sheets</button>
  <span class="sync-status" id="sync-status"></span>
  <span class="user-info" id="user-info"></span>
  <button class="logout-btn" onclick="window.location='/logout'">Logout</button>
</div>

<!-- MANAGER SCHEDULE VIEW -->
<div id="manager-section">
  <div class="summary-bar" id="summary-bar"></div>
  <div id="missing-panel-wrap" class="missing-wrap"></div>
  <div class="manager-view">
    <div class="grid-wrap" id="grid-wrap"></div>
  </div>
</div>

<!-- SCHEDULED QUEUE -->
<div id="queue-section" style="display:none">
  <div class="sched-section">
    <div class="sched-header">Upcoming scheduled deliveries <span class="sched-count" id="sched-count">0</span></div>
    <div class="sched-list" id="sched-list"></div>
  </div>
</div>

<!-- HISTORY -->
<div id="history-section" style="display:none">
  <div class="history-section">
    <div class="history-header">Completed jobs <span class="history-count" id="history-count">0</span></div>
    <div id="history-list"></div>
  </div>
</div>

<!-- DRIVER VIEW -->
<div id="driver-section" style="display:none">
  <div class="driver-view">
    <div class="driver-bar" id="driver-bar">
      <label>My Truck:</label>
      <select id="driver-select" onchange="renderDriverView()"></select>
    </div>
    <div id="driver-day-list"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add job</h2>
      <button class="mclose" onclick="closeModal()">&#215;</button>
    </div>
    <div class="mbody">
      <div class="frow">
        <div class="fld"><label>Truck / Driver</label><select id="f-truck"></select></div>
        <div class="fld"><label>Job type</label>
          <select id="f-type" onchange="onTypeChange()">
            <option value="one-time">One-time</option>
            <option value="scheduled">Scheduled (future date)</option>
            <option value="recurring">Recurring</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fld"><label>Delivery date</label><input type="date" id="f-dueDate"></div>
        <div class="fld recurrence-row" id="recurrence-row">
          <label>Repeat every</label>
          <select id="f-recurrence">
            <option value="weekly">Week</option>
            <option value="biweekly">2 Weeks</option>
            <option value="monthly">Month</option>
          </select>
        </div>
      </div>
      <div class="frow">
        <div class="fld"><label>Supervisor on site</label><input id="f-super" placeholder="e.g. Billy"></div>
        <div class="fld"><label>Driver name</label><input id="f-driver" placeholder="e.g. Beryle"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Customer / Project</label><input id="f-customer" placeholder="e.g. Wilson Homes"></div>
        <div class="fld"><label>Job code</label><input id="f-code" placeholder="e.g. WHAT-01"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Material</label>
          <select id="f-material">
            <option>Fill Sand</option><option>3/4 Rock</option>
            <option>Recycle Base</option><option>Cold Mix</option>
            <option>Dirt</option><option>Base Rock</option><option>Other</option>
          </select>
        </div>
        <div class="fld"><label>Loads ordered</label><input id="f-loads" type="number" min="0" step="0.5" placeholder="0"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Pickup location</label>
          <select id="f-pickup">
            <option>VBT Yard</option><option>Keith Farms</option>
            <option>CEMEX</option><option>Vulcan Sanger</option>
            <option>Precision Bakersfield</option><option>Other</option>
          </select>
        </div>
        <div class="fld"><label>PO #</label><input id="f-po" placeholder="e.g. PO 3083"></div>
      </div>
      <div class="frow">
        <div class="fld"><label>Delivery city / address</label><input id="f-city" placeholder="e.g. Fresno"></div>
        <div class="fld"><label>Loads delivered</label><input id="f-delivered" type="number" min="0" step="0.5" placeholder="0"></div>
      </div>
      <div class="fld"><label>Notes</label><textarea id="f-notes" placeholder="Special instructions, lot #s, etc."></textarea></div>
      <!-- Timestamps (driver only) -->
      <div id="timestamp-section" style="display:none">
        <div class="fld">
          <label>Timestamps</label>
          <div style="display:flex;flex-direction:column;gap:7px;margin-top:4px">
            <div class="ts-row"><button type="button" class="ts-btn" onclick="stampNow('f-ts-start')">&#9654; Start</button><input id="f-ts-start" class="ts-input" readonly placeholder="not stamped"></div>
            <div class="ts-row"><button type="button" class="ts-btn" onclick="stampNow('f-ts-first')">&#10003; First load</button><input id="f-ts-first" class="ts-input" readonly placeholder="not stamped"></div>
            <div class="ts-row"><button type="button" class="ts-btn" onclick="stampNow('f-ts-last')">&#9632; Last load</button><input id="f-ts-last" class="ts-input" readonly placeholder="not stamped"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Move / Reassign (manager editing existing job) -->
    <div class="move-reassign" id="move-reassign">
      <div class="mr-title">Move or reassign</div>
      <div class="frow">
        <div class="fld"><label>Move to date</label><input type="date" id="move-date"></div>
        <div class="fld"><label>Reassign to truck</label>
          <select id="reassign-truck">
            <option value="">-- same driver --</option>
          </select>
        </div>
      </div>
      <button class="btn-s" style="font-size:12px;padding:6px 14px" onclick="moveOrReassignJob()">Apply</button>
    </div>
    <div class="mfoot">
      <button class="btn-d" id="delete-btn" style="display:none" onclick="deleteJob()">Delete</button>
      <button class="btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn-p" onclick="saveJob()">Save job</button>
    </div>
  </div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];

let trucks = [], jobs = [], scheduledJobs = [], completedJobs = [];
let weekOffset = 0, editingId = null, currentTab = 'manager';
let missingOpen = true, userRole = 'driver', userTruckId = null;

// ── Date helpers ──────────────────────────────────────────────────────────────
function getWeekStart(){
  const d=new Date(), day=d.getDay(), diff=(day===0?-6:1-day);
  const m=new Date(d); m.setDate(d.getDate()+diff+weekOffset*7); m.setHours(0,0,0,0); return m;
}
function weekDates(){
  const m=getWeekStart();
  return DAYS.map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});
}
function toYMD(d){ return d.toISOString().slice(0,10); }
function fmt(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtFull(iso){ if(!iso) return ''; const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function daysUntil(iso){ const t=new Date(iso+'T12:00:00'), n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/(1000*60*60*24)); }
function dayName(iso){ const d=new Date(iso+'T12:00:00'); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function changeWeek(dir){ weekOffset+=dir; render(); }

function onTypeChange(){
  const t=document.getElementById('f-type').value;
  document.getElementById('recurrence-row').classList.toggle('show', t==='recurring');
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  ['manager','queue','history','driver'].forEach(t=>{
    document.getElementById('tab-'+({manager:'mgr',queue:'queue',history:'history',driver:'drv'}[t])).classList.toggle('active',tab===t);
    document.getElementById(t+'-section').style.display=tab===t?'block':'none';
  });
  document.getElementById('week-nav-wrap').style.display=tab==='manager'?'flex':'none';
  if(tab==='driver') renderDriverView();
  if(tab==='queue')  renderQueue();
  if(tab==='history') renderHistory();
}

// ── Summary ───────────────────────────────────────────────────────────────────
function renderSummary(){
  const totalL=jobs.reduce((s,j)=>s+(Number(j.loads)||0),0);
  const totalD=jobs.reduce((s,j)=>s+(Number(j.delivered)||0),0);
  const missing=getMissingJobs();
  const totalM=missing.reduce((s,j)=>s+(Number(j.loads)||0)-(Number(j.delivered)||0),0);
  document.getElementById('summary-bar').innerHTML=`
    <div class="metric"><div class="ml">Active jobs</div><div class="mv">${jobs.length}</div></div>
    <div class="metric"><div class="ml">Loads ordered</div><div class="mv">${totalL}</div></div>
    <div class="metric"><div class="ml">Loads delivered</div><div class="mv">${totalD}</div></div>
    <div class="metric ${totalM>0?'warn':''}"><div class="ml">Missing</div><div class="mv">${totalM}</div></div>
    <div class="metric sched"><div class="ml">Scheduled</div><div class="mv">${scheduledJobs.length}</div></div>
    <div class="metric info"><div class="ml">Completed</div><div class="mv">${completedJobs.length}</div></div>
  `;
}

// ── Missing panel ─────────────────────────────────────────────────────────────
function getMissingJobs(){ return jobs.filter(j=>(Number(j.loads)||0)>0&&(Number(j.delivered)||0)<(Number(j.loads)||0)); }
function toggleMissing(){ missingOpen=!missingOpen; render(); }
function renderMissing(){
  const missing=getMissingJobs();
  const totalM=missing.reduce((s,j)=>s+(Number(j.loads)||0)-(Number(j.delivered)||0),0);
  if(!missing.length){ document.getElementById('missing-panel-wrap').innerHTML=''; return; }
  let h=`<div class="missing-panel">
    <div class="missing-head" onclick="toggleMissing()">
      <span class="mh-title">&#9888; ${missing.length} job${missing.length>1?'s':''} with missing loads — ${totalM} short</span>
      <span class="mh-toggle">${missingOpen?'▲ hide':'▼ show'}</span>
    </div>`;
  if(missingOpen){
    h+=`<div class="missing-list">`;
    missing.forEach(j=>{
      const short=(Number(j.loads)||0)-(Number(j.delivered)||0);
      const t=trucks.find(t=>t.id===j.truck);
      h+=`<div class="missing-item" onclick="openEdit(${j.id})">
        <div><div class="mi-cust">${j.customer}${j.code?' · '+j.code:''}</div>
        <div class="mi-meta">${fmtFull(j.dueDate)} · ${t?t.label+' ('+t.truckNum+')':j.truck} · ${j.city||''}</div></div>
        <span class="mi-badge">−${short} load${short!==1?'s':''}</span>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById('missing-panel-wrap').innerHTML=h;
}

// ── Manager grid ──────────────────────────────────────────────────────────────
function render(){
  renderSummary();
  renderMissing();
  if(currentTab==='manager') renderGrid();
}

function renderGrid(){
  const dates=weekDates();
  const mon=getWeekStart(), sun=new Date(mon); sun.setDate(mon.getDate()+5);
  document.getElementById('week-label').textContent=fmt(mon)+' – '+fmt(sun);
  const numT=trucks.length;
  const colPct=Math.floor(100/numT);
  const cols=trucks.map(()=>colPct+'%').join(' ');
  let gh='';
  dates.forEach((date,di)=>{
    const dayName=DAYS[di];
    const dateStr=toYMD(date);
    gh+=`<div>
      <div class="day-label-row"><span class="dlday">${dayName}</span><span class="dldate">${fmt(date)}</span></div>
      <div class="col-header-row" style="grid-template-columns:${cols}">`;
    trucks.forEach(t=>{
      const isManager=userRole==='manager';
      gh+=`<div class="col-hdr"><span class="truck-label">${t.label}</span>
        ${isManager?`<input class="truck-num-input" value="${t.truckNum}" title="Edit truck #" onchange="updateTruckNum('${t.id}',this.value)" onclick="event.stopPropagation()">`:
        `<span style="font-family:var(--mono);font-size:10px;color:var(--txt3)">${t.truckNum}</span>`}
      </div>`;
    });
    gh+=`</div><div class="jobs-cols" style="grid-template-columns:${cols}">`;
    trucks.forEach(t=>{
      const tJobs=jobs.filter(j=>j.truck===t.id&&j.dueDate===dateStr);
      gh+=`<div class="truck-col">`;
      tJobs.forEach(j=>{
        const l=Number(j.loads)||0,d=Number(j.delivered)||0,short=l-d;
        const isMiss=l>0&&d<l;
        const isRec=j.type==='recurring';
        let pills='';
        if(l>0){
          if(d>=l) pills=`<span class="pill green">${d}/${l} done</span>`;
          else if(d>0) pills=`<span class="pill amber">${d}/${l}</span><span class="pill red">−${short}</span>`;
          else pills=`<span class="pill">${l} loads</span>`;
        }
        if(isRec) pills+=`<span class="pill purple">recurring</span>`;
        gh+=`<div class="job-card ${isMiss?'missing':''} ${isRec?'is-recurring':''}" onclick="openEdit(${j.id})">
          <div class="jc-cust">${j.customer}</div>
          <div class="jc-sub">${j.code||''}${j.city?' · '+j.city:''}</div>
          <div class="jc-pills">${pills}<span class="pill">${j.material||''}</span></div>
        </div>`;
      });
      if(userRole==='manager') gh+=`<button class="add-btn" onclick="openAdd('${t.id}','${dateStr}')">+ add job</button>`;
      gh+=`</div>`;
    });
    gh+=`</div></div>`;
  });
  document.getElementById('grid-wrap').innerHTML=gh;
  // Repopulate driver select
  const ds=document.getElementById('driver-select');
  const prev=ds.value;
  ds.innerHTML=trucks.map(t=>`<option value="${t.id}">${t.label} (${t.truckNum})</option>`).join('');
  if(prev) ds.value=prev;
}

// ── Scheduled queue ───────────────────────────────────────────────────────────
function renderQueue(){
  const sorted=[...scheduledJobs].sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  document.getElementById('sched-count').textContent=sorted.length;
  if(!sorted.length){
    document.getElementById('sched-list').innerHTML=`<div class="no-jobs">No scheduled deliveries yet.</div>`;
    return;
  }
  document.getElementById('sched-list').innerHTML=sorted.map(j=>{
    const t=trucks.find(x=>x.id===j.truck);
    const d=daysUntil(j.dueDate);
    const dLabel=d===0?'today':d===1?'tomorrow':`in ${d} days`;
    return `<div class="sched-card" onclick="openEdit(${j.id})">
      <div class="sc-left">
        <div class="sc-cust">${j.customer}${j.code?' · <span style="font-family:var(--mono);font-size:11px">'+j.code+'</span>':''}</div>
        <div class="sc-meta">${t?t.label+' ('+t.truckNum+')':j.truck} · ${j.material||''} · ${j.loads||0} loads · ${j.city||''}</div>
      </div>
      <div>
        <div class="sc-date">${fmtFull(j.dueDate)}</div>
        <div class="sc-days">${dLabel}</div>
        <span class="pill purple" style="margin-top:4px;display:inline-block">${j.type==='recurring'?'recurring':'scheduled'}</span>
      </div>
    </div>`;
  }).join('');
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory(){
  document.getElementById('history-count').textContent=completedJobs.length;
  if(!completedJobs.length){
    document.getElementById('history-list').innerHTML=`<div class="no-jobs">No completed jobs yet.</div>`;
    return;
  }
  // Group by month
  const byMonth={};
  completedJobs.forEach(j=>{
    const m=j.completedAt?j.completedAt.slice(0,7):(j.dueDate||'').slice(0,7)||'unknown';
    if(!byMonth[m]) byMonth[m]=[];
    byMonth[m].push(j);
  });
  let h='';
  Object.keys(byMonth).sort().reverse().forEach(month=>{
    const label=month==='unknown'?'Unknown date':new Date(month+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
    h+=`<div class="history-month"><div class="history-month-label">${label}</div>`;
    byMonth[month].forEach(j=>{
      const t=trucks.find(x=>x.id===j.truck);
      const completedDate=j.completedAt?new Date(j.completedAt).toLocaleDateString('en-US',{month:'short',day:'numeric'}):fmtFull(j.dueDate);
      h+=`<div class="history-item">
        <div class="hi-left">
          <div class="hi-cust">${j.customer}${j.code?' · '+j.code:''}</div>
          <div class="hi-meta">${t?t.label+' ('+t.truckNum+')':j.truck} · ${j.material||''} · ${j.city||''}</div>
        </div>
        <div class="hi-right">
          <div class="hi-date">&#10003; ${completedDate}</div>
          <div class="hi-loads">${j.delivered||0}/${j.loads||0} loads</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  });
  document.getElementById('history-list').innerHTML=h;
}

// ── Driver view ───────────────────────────────────────────────────────────────
function renderDriverView(){
  const ds=document.getElementById('driver-select');
  const tid=ds.value||userTruckId;
  if(!tid) return;
  const today=toYMD(new Date());
  // Group jobs by date
  const myJobs=jobs.filter(j=>j.truck===tid).sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  if(!myJobs.length){ document.getElementById('driver-day-list').innerHTML=`<div class="no-jobs">No active jobs assigned to you this week.</div>`; return; }
  const byDate={};
  myJobs.forEach(j=>{ const k=j.dueDate||'no-date'; if(!byDate[k]) byDate[k]=[]; byDate[k].push(j); });
  let html='';
  Object.keys(byDate).sort().forEach(dateKey=>{
    const dayJobs=byDate[dateKey];
    const tL=dayJobs.reduce((s,j)=>s+(Number(j.loads)||0),0);
    const tD=dayJobs.reduce((s,j)=>s+(Number(j.delivered)||0),0);
    const tM=tL-tD;
    const label=dateKey==='no-date'?'No date set':`${dayName(dateKey)} ${fmtFull(dateKey)}`;
    const isToday=dateKey===today;
    html+=`<div class="drv-day">
      <div class="drv-day-head" style="${isToday?'border-left:3px solid var(--green)':''}">
        <span class="dday">${label}${isToday?' <span style="font-size:10px;color:var(--green);margin-left:4px">TODAY</span>':''}</span>
        <span class="dtot ${tM>0?'warn':''}">${tD}/${tL}${tM>0?' · '+tM+' missing':''}</span>
      </div><div class="drv-jobs">`;
    dayJobs.forEach(j=>{
      const l=Number(j.loads)||0,d=Number(j.delivered)||0,miss=l-d;
      const isMiss=l>0&&d<l;
      const ts=j.timestamps||{};
      html+=`<div class="drv-job ${isMiss?'missing':''}">
        <div class="djl">
          <div class="cust">${j.customer}${j.code?` <span style="font-family:var(--mono);font-size:11px;color:var(--txt2)">· ${j.code}</span>`:''}</div>
          <div class="meta">
            <b>Material:</b> ${j.material||''}<br>
            <b>Pickup:</b> ${j.pickup||''}${j.po?' · <b>PO:</b> '+j.po:''}<br>
            ${j.city?`<b>Deliver to:</b> ${j.city}<br>`:''}
            ${j.supervisor?`<b>Supervisor:</b> ${j.supervisor}<br>`:''}
            ${j.notes?`<em style="color:var(--txt3)">${j.notes}</em><br>`:''}
            ${ts.start||ts.first||ts.last?`<span style="font-family:var(--mono);font-size:10px;color:var(--txt3)">${ts.start?'▶ '+ts.start+' ':''} ${ts.first?'✓ '+ts.first+' ':''}${ts.last?'■ '+ts.last:''}</span>`:''}
          </div>
          <div style="margin-top:6px">${isMiss?`<span class="pill red">${miss} missing</span>`:`<span class="pill green">Complete</span>`}</div>
        </div>
        <div class="djr">
          <div class="big">${d}<span style="font-size:14px;color:var(--txt2)">/${l}</span></div>
          <div class="lbl">delivered</div>
          <button class="log-btn" onclick="quickLog(${j.id})">Log loads</button>
          <button class="complete-btn" onclick="completeJob(${j.id})">Mark done</button>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('driver-day-list').innerHTML=html;
}

// ── Complete a job ────────────────────────────────────────────────────────────
async function completeJob(id){
  if(!confirm('Mark this job as completed and move it to history?')) return;
  try{
    const res=await fetch('/api/jobs/'+id+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const data=await res.json();
    if(data.jobs) jobs=data.jobs;
    if(data.scheduledJobs) scheduledJobs=data.scheduledJobs;
    if(data.completedJobs) completedJobs=data.completedJobs;
    render();
    renderDriverView();
  } catch(e){ alert('Error: '+e.message); }
}

// ── Truck number edit ─────────────────────────────────────────────────────────
function updateTruckNum(id,val){
  const t=trucks.find(x=>x.id===id);
  if(t){ t.truckNum=val; fetch('/api/trucks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(trucks)}); }
}

// ── Modal open/close ──────────────────────────────────────────────────────────
function openAdd(truckId, dateStr){
  if(userRole!=='manager'){ alert('Only managers can add jobs.'); return; }
  editingId=null;
  document.getElementById('modal-title').textContent='Add job';
  document.getElementById('delete-btn').style.display='none';
  document.getElementById('move-reassign').classList.remove('show');
  clearForm();
  document.getElementById('f-truck').value=truckId;
  document.getElementById('f-dueDate').value=dateStr||toYMD(new Date());
  document.getElementById('modal').style.display='flex';
}

function openEdit(id){
  // Check both active and scheduled jobs
  const j=jobs.find(x=>x.id===id)||scheduledJobs.find(x=>x.id===id);
  if(!j) return;
  editingId=id;
  document.getElementById('modal-title').textContent=userRole==='manager'?'Edit job':'Log loads';
  document.getElementById('delete-btn').style.display=userRole==='manager'?'block':'none';
  document.getElementById('f-truck').value=j.truck;
  document.getElementById('f-type').value=j.type||'one-time';
  document.getElementById('f-dueDate').value=j.dueDate||'';
  document.getElementById('f-recurrence').value=j.recurrenceRule||'weekly';
  document.getElementById('f-super').value=j.supervisor||'';
  document.getElementById('f-driver').value=j.driver||'';
  document.getElementById('f-customer').value=j.customer||'';
  document.getElementById('f-code').value=j.code||'';
  document.getElementById('f-material').value=j.material||'Fill Sand';
  document.getElementById('f-loads').value=j.loads||'';
  document.getElementById('f-pickup').value=j.pickup||'VBT Yard';
  document.getElementById('f-po').value=j.po||'';
  document.getElementById('f-city').value=j.city||'';
  document.getElementById('f-delivered').value=j.delivered||'';
  document.getElementById('f-notes').value=j.notes||'';
  onTypeChange();
  if(userRole==='driver'){
    ['f-truck','f-type','f-dueDate','f-recurrence','f-super','f-driver','f-customer','f-code','f-material','f-loads','f-pickup','f-po','f-city'].forEach(fid=>{
      const el=document.getElementById(fid); if(el){el.disabled=true;el.style.opacity='0.6';}
    });
    document.getElementById('timestamp-section').style.display='block';
    const ts=j.timestamps||{};
    document.getElementById('f-ts-start').value=ts.start||'';
    document.getElementById('f-ts-first').value=ts.first||'';
    document.getElementById('f-ts-last').value=ts.last||'';
    document.getElementById('move-reassign').classList.remove('show');
    setTimeout(()=>document.getElementById('f-delivered').focus(),80);
  } else {
    ['f-truck','f-type','f-dueDate','f-recurrence','f-super','f-driver','f-customer','f-code','f-material','f-loads','f-pickup','f-po','f-city'].forEach(fid=>{
      const el=document.getElementById(fid); if(el){el.disabled=false;el.style.opacity='';}
    });
    document.getElementById('timestamp-section').style.display='none';
    // Move/reassign section
    document.getElementById('move-reassign').classList.add('show');
    document.getElementById('move-date').value=j.dueDate||'';
    const rSelect=document.getElementById('reassign-truck');
    rSelect.innerHTML='<option value="">-- same driver --</option>'+trucks.map(t=>`<option value="${t.id}">${t.label} (${t.truckNum})</option>`).join('');
    rSelect.value='';
  }
  document.getElementById('modal').style.display='flex';
}

function quickLog(id){ openEdit(id); }

function clearForm(){
  ['f-super','f-driver','f-customer','f-code','f-loads','f-po','f-city','f-delivered','f-notes'].forEach(id=>{
    const el=document.getElementById(id); if(el){el.value='';el.disabled=false;el.style.opacity='';}
  });
  ['f-material','f-pickup','f-truck','f-type','f-recurrence'].forEach(id=>{
    const el=document.getElementById(id); if(el){el.disabled=false;el.style.opacity='';}
  });
  document.getElementById('f-material').value='Fill Sand';
  document.getElementById('f-pickup').value='VBT Yard';
  document.getElementById('f-type').value='one-time';
  document.getElementById('f-dueDate').value=toYMD(new Date());
  document.getElementById('timestamp-section').style.display='none';
  document.getElementById('recurrence-row').classList.remove('show');
}

function closeModal(){
  document.getElementById('modal').style.display='none';
  editingId=null; clearForm();
}

// ── Save job ──────────────────────────────────────────────────────────────────
async function saveJob(){
  const g=id=>document.getElementById(id)?.value?.trim()||'';
  let job;
  if(editingId){
    const orig=jobs.find(x=>x.id===editingId)||scheduledJobs.find(x=>x.id===editingId);
    job = userRole==='manager' ? {
      id:editingId, truck:g('f-truck'), type:g('f-type'),
      dueDate:g('f-dueDate'), recurrenceRule:g('f-type')==='recurring'?g('f-recurrence'):null,
      supervisor:g('f-super'), driver:g('f-driver'), customer:g('f-customer'), code:g('f-code'),
      material:g('f-material'), loads:Number(g('f-loads'))||0, pickup:g('f-pickup'),
      po:g('f-po'), city:g('f-city'), delivered:Number(g('f-delivered'))||0, notes:g('f-notes'),
    } : {
      id:editingId, delivered:Number(g('f-delivered'))||0, notes:g('f-notes'),
      timestamps:{
        start: document.getElementById('f-ts-start').value||(orig?.timestamps?.start||''),
        first: document.getElementById('f-ts-first').value||(orig?.timestamps?.first||''),
        last:  document.getElementById('f-ts-last').value||(orig?.timestamps?.last||''),
      }
    };
  } else {
    job={
      truck:g('f-truck'), type:g('f-type'),
      dueDate:g('f-dueDate'), recurrenceRule:g('f-type')==='recurring'?g('f-recurrence'):null,
      supervisor:g('f-super'), driver:g('f-driver'), customer:g('f-customer'), code:g('f-code'),
      material:g('f-material'), loads:Number(g('f-loads'))||0, pickup:g('f-pickup'),
      po:g('f-po'), city:g('f-city'), delivered:Number(g('f-delivered'))||0, notes:g('f-notes'),
    };
    if(!job.customer){ alert('Customer is required'); return; }
  }
  try{
    const res=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(job)});
    const data=await res.json();
    if(data.jobs) jobs=data.jobs;
    // Reload full data to get updated scheduled jobs too
    await loadAppData();
  } catch(e){ alert('Error saving: '+e.message); return; }
  closeModal(); render();
  if(currentTab==='driver') renderDriverView();
  if(currentTab==='queue') renderQueue();
}

async function deleteJob(){
  if(!confirm('Delete this job permanently?')) return;
  try{
    await fetch('/api/jobs/'+editingId,{method:'DELETE'});
    await loadAppData();
  } catch(e){ alert('Error: '+e.message); return; }
  closeModal(); render();
  if(currentTab==='queue') renderQueue();
}

// ── Move / Reassign ───────────────────────────────────────────────────────────
async function moveOrReassignJob(){
  if(!editingId) return;
  const job=jobs.find(x=>x.id===editingId)||scheduledJobs.find(x=>x.id===editingId);
  if(!job) return;
  const newDate=document.getElementById('move-date').value;
  const newTruck=document.getElementById('reassign-truck').value;
  if(!newDate&&!newTruck){ alert('Pick a new date or a new driver.'); return; }
  const updated={
    ...job,
    dueDate: newDate||job.dueDate,
    truck: newTruck||job.truck,
    driver: newTruck?(trucks.find(t=>t.id===newTruck)?.label||job.driver):job.driver,
  };
  try{
    const res=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updated)});
    const data=await res.json();
    if(data.jobs) jobs=data.jobs;
    await loadAppData();
  } catch(e){ alert('Error: '+e.message); return; }
  closeModal(); render();
  if(currentTab==='queue') renderQueue();
}

// ── Timestamps ────────────────────────────────────────────────────────────────
function stampNow(fieldId){
  const el=document.getElementById(fieldId);
  el.value=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
  el.style.color='var(--green)';
}

// ── Sheets sync ───────────────────────────────────────────────────────────────
async function syncToSheets(){
  const btn=document.getElementById('sync-btn');
  const st=document.getElementById('sync-status');
  btn.disabled=true; btn.textContent='Syncing…'; st.className='sync-status'; st.textContent='';
  try{
    const res=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const data=await res.json();
    if(data.success){ st.className='sync-status ok'; st.textContent='Synced ✓ '+new Date().toLocaleTimeString()+' ('+data.rowsWritten+' rows)'; }
    else throw new Error(data.error||'Unknown error');
  } catch(e){ st.className='sync-status err'; st.textContent='Sync failed: '+e.message; }
  finally{ btn.disabled=false; btn.textContent='↑ Sheets'; }
}

// ── Load data from server ─────────────────────────────────────────────────────
async function loadAppData(){
  const res=await fetch('/api/data');
  const data=await res.json();
  trucks=data.trucks||[];
  jobs=data.jobs||[];
  scheduledJobs=data.scheduledJobs||[];
  completedJobs=data.completedJobs||[];
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const meRes=await fetch('/api/me');
    const me=await meRes.json();
    userRole=me.role; userTruckId=me.truckId||null;
    document.getElementById('user-info').textContent=me.username;
    if(userRole==='manager') document.body.classList.add('is-manager');
    await loadAppData();
  } catch(e){ console.error('Init error:',e); }

  // Populate truck select in modal
  document.getElementById('f-truck').innerHTML=trucks.map(t=>`<option value="${t.id}">${t.label} (${t.truckNum})</option>`).join('');

  if(userRole==='driver'){
    document.getElementById('tab-mgr').style.display='none';
    document.getElementById('tab-queue').style.display='none';
    document.getElementById('driver-bar').style.display='none';
    const ds=document.getElementById('driver-select');
    ds.innerHTML=trucks.map(t=>`<option value="${t.id}">${t.label} (${t.truckNum})</option>`).join('');
    if(userTruckId) ds.value=userTruckId;
    switchTab('driver');
  } else {
    render();
  }
}

init();
</script>
